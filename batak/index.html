<!doctype html>
<html lang="tr">
<head>
<!--standalone-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1a33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<!--/standalone-->
<title>Eşli Açmalı Batak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@700;800&family=Figtree:wght@400;600;700;800&display=swap">
<style>
:root{
  --felt-deep:#0a1a33; --felt-hi:#1d4585;
  --ivory:#f6efdf; --ivory-edge:#d9ccae; --ink:#18223b; --red:#c2362b;
  --turq:#3cc4b3; --gold:#e2b659; --text:#eef2f9; --muted:#9fb1d0; --line:rgba(246,239,223,.12);
  --us:#1d7472; --them:#93392f; --paper-ink:#3a4460; --paper-line:#e6dcc6;
  --side:64px;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;background:var(--felt-deep);overscroll-behavior:none}
body{height:100%;margin:0;overflow:hidden;color:var(--text);background-color:var(--felt-deep);
  background-image:radial-gradient(120% 75% at 50% 46%,rgba(40,92,170,.55),rgba(10,26,51,0) 72%),
    repeating-conic-gradient(from 45deg,rgba(246,239,223,.028) 0 25%,transparent 0 50%);
  background-size:100% 100%,28px 28px;
  font:15px/1.35 "Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
#app{height:100%;display:flex;flex-direction:column;padding-inline:16px;position:relative;max-width:1100px;margin-inline:auto}

/* Üst çubuk */
.top{flex:none;display:flex;align-items:center;gap:8px;height:54px;border-bottom:1px solid var(--line)}
.score{flex:none;display:flex;gap:1px;padding:0;border:0;background:rgba(0,0,0,.22);border-radius:12px;overflow:hidden;height:42px}
.score .t{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:50px;padding:0 8px}
.score .t+.t{border-left:1px solid var(--line)}
.score small{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.score b{font:800 19px/1 "Figtree",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.score .us b{color:#86e3d6}.score .them b{color:#f3ab9f}
.info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px;overflow:hidden}
.info .c1{font-size:11px;color:var(--muted);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .c2{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.tchip{flex:none;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--ivory);color:var(--ink);font-size:15px;line-height:1}
.tchip.r{color:var(--red)}
.prog{font-variant-numeric:tabular-nums;color:var(--gold)}
.icon{flex:none;width:42px;height:42px;border-radius:12px;border:0;background:rgba(0,0,0,.22);display:grid;place-items:center;color:var(--text)}
.icon:disabled{opacity:.3;cursor:default}
.icon[aria-pressed="true"]{background:var(--ivory);color:var(--ink)}
.icon svg{width:22px;height:22px}

/* Oyuncular */
#north{flex:none;display:flex;align-items:center;justify-content:center;gap:10px;min-height:60px;padding-block:6px}
#north.dummy{justify-content:flex-start;align-items:flex-end}
#northSeat{flex:none;display:flex;align-items:center;gap:12px}
#ncards{position:relative;flex:1;min-width:0}
.seat{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.seat.h{flex-direction:row;gap:10px;text-align:left}
.av{position:relative;flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:800 19px/1 "Alegreya",Georgia,serif;color:var(--ivory);background:var(--us);box-shadow:0 0 0 2px rgba(246,239,223,.55);transition:box-shadow .2s}
.them .av{background:var(--them)}
.turn .av{box-shadow:0 0 0 3px var(--turq),0 0 18px 3px rgba(60,196,179,.5)}
.turn .av::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--turq);opacity:0;animation:ring 1.4s ease-out infinite}
@keyframes ring{0%{opacity:.8;transform:scale(.85)}100%{opacity:0;transform:scale(1.25)}}
.dealer{position:absolute;right:-5px;bottom:-5px;width:18px;height:18px;border-radius:50%;background:var(--gold);color:#2b1e05;font:800 10px/18px "Figtree",system-ui,sans-serif;text-align:center;box-shadow:0 0 0 2px var(--felt-deep)}
.who{min-width:0}
.seat:not(.h) .av{margin-bottom:3px}
.nm{font-weight:700;font-size:13px;line-height:1.1}
.role{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;margin-top:2px}
.chips{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.seat.h .chips{justify-content:flex-start}
.chip{display:inline-flex;align-items:center;gap:2px;font:700 12px/1 "Figtree",system-ui,sans-serif;padding:4px 7px;border-radius:999px;background:rgba(246,239,223,.12);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.bid{background:var(--ivory);color:var(--ink);font-size:13px}
.chip.pas{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.chip.contract{background:var(--gold);color:#2b1e05}
.chip.contract em{font-style:normal}
.chip.open{background:transparent;box-shadow:inset 0 0 0 1.5px var(--turq);color:var(--turq)}
.chip.tk::before{content:"";width:7px;height:10px;border-radius:2px;background:var(--ivory);opacity:.85;margin-right:4px}
.backs{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.mini-back,.back{background-color:#1b4a8f;background-image:radial-gradient(circle at 50% 50%,var(--red) 0 20%,transparent 23%),linear-gradient(45deg,rgba(246,239,223,.35) 12%,transparent 12% 88%,rgba(246,239,223,.35) 88%),linear-gradient(-45deg,rgba(246,239,223,.35) 12%,transparent 12% 88%,rgba(246,239,223,.35) 88%);background-size:8px 8px}
.mini-back{display:block;width:15px;height:21px;border-radius:3px;box-shadow:0 0 0 1.5px var(--ivory),3px -2px 0 -1px #1b4a8f,3px -2px 0 .5px var(--ivory)}

/* Açık el listesi (yan oyuncular) */
.dlist{width:100%;background:var(--ivory);color:var(--ink);border-radius:8px;padding:5px 6px;display:flex;flex-direction:column;gap:2px;font:800 13px/1.15 "Alegreya",Georgia,serif;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.dl-row{display:flex;gap:4px;align-items:baseline}
.dl-row b{flex:none;width:12px;font-weight:400}
.dl-row.red{color:var(--red)}
.dl-row span{min-width:0;overflow-wrap:anywhere}

/* Masa */
#mid{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:var(--side) minmax(0,1fr) var(--side);gap:6px}
.side{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:0;min-width:0;overflow:hidden}
#table{position:relative;min-height:0;min-width:0}
.medallion{position:absolute;left:50%;top:50%;width:min(52%,150px);max-width:100%;aspect-ratio:1;translate:-50% -50%;pointer-events:none;transition:opacity .3s}
.medallion i{position:absolute;inset:15%;border:1.5px solid rgba(226,182,89,.2);border-radius:3px}
.medallion i+i{rotate:45deg}
.medallion::before{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid rgba(246,239,223,.08)}
.medallion::after{content:"";position:absolute;inset:36%;border-radius:50%;background:radial-gradient(circle,rgba(60,196,179,.16),transparent 70%)}
#table.busy .medallion{opacity:.35}
#trick{position:absolute;inset:0;pointer-events:none}
#cmsg{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;text-align:center;padding:8px;z-index:1}
.cm{display:flex;flex-direction:column;align-items:center;gap:4px;max-width:230px}
.cm .eb{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.cm .big{font:800 46px/1 "Alegreya",Georgia,serif;color:var(--ivory)}
.cm .sub{font-size:13px;color:var(--muted)}
.cm .tip{margin-top:8px;font-size:12px;line-height:1.4;color:var(--text);background:rgba(5,14,30,.45);padding:7px 11px;border-radius:10px;text-wrap:balance}
#stag{position:absolute;left:0;bottom:2px;pointer-events:none;z-index:2}
.stag{display:flex;align-items:center;gap:5px;padding:4px 8px 4px 6px;border-radius:999px;background:rgba(5,14,30,.35)}
.stag .nm{font-size:12px;padding-inline:2px}
.stag.turn{box-shadow:inset 0 0 0 1.5px var(--turq)}
.stag .dealer{position:static;box-shadow:none}
#lastCap{position:absolute;left:50%;top:2px;translate:-50% 0;z-index:3;white-space:nowrap;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--ivory);color:var(--ink);pointer-events:none}

/* Eylem çubuğu */
#actions{flex:none;min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:6px}
.status{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.status b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status.mine b{color:var(--turq)}
.bidrow{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.bidrow .btn{flex:1 1 0;min-width:40px;padding:0}
.bidrow .pass{flex:1.7 1 0}
.trumprow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:100%}
.btn{height:46px;padding:0 14px;border:0;border-radius:12px;background:var(--ivory);color:var(--ink);font:800 17px/1 "Figtree",system-ui,sans-serif;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 var(--ivory-edge),0 4px 10px rgba(0,0,0,.3);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ivory-edge),0 2px 6px rgba(0,0,0,.3)}
.btn.ghost{background:rgba(5,14,30,.3);color:var(--text);box-shadow:inset 0 0 0 1.5px rgba(246,239,223,.38)}
.btn.sm{height:38px;font-size:14px;padding:0 12px;flex:none}
.btn.primary{background:var(--turq);color:#06231f;box-shadow:0 3px 0 #2a8f83,0 4px 10px rgba(0,0,0,.25)}
.btn.suit{height:64px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.btn.suit .sym{font-size:28px;line-height:1}
.btn.suit small{font-size:11px;font-weight:700;color:#5b6378}
.btn.suit.red .sym{color:var(--red)}
.btn:focus-visible,.icon:focus-visible,.score:focus-visible,.card:focus-visible,.seg button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* El */
#south{flex:none;position:relative;padding-bottom:8px}
#south::before{content:"";position:absolute;left:12%;right:12%;top:0;height:2px;border-radius:2px;background:var(--turq);opacity:0;transition:opacity .2s}
#south.turn::before{opacity:.9}
.cards{position:relative;width:100%}
.cards.active .card{cursor:pointer}

/* Kart */
.card{position:absolute;left:0;top:0;width:var(--w);height:var(--h);border-radius:calc(var(--w)*.11);background:linear-gradient(180deg,#fcf8ee,var(--ivory));color:var(--ink);
  box-shadow:0 0 0 1px rgba(24,34,59,.22),0 2px 5px rgba(0,0,0,.35);font-family:"Alegreya",Georgia,serif;
  transform:rotate(var(--rot,0deg));translate:0 var(--lift,0px);
  transition:translate .16s ease,left .22s ease,top .22s ease,filter .15s,box-shadow .15s;touch-action:none}
.card.red{color:var(--red)}
.card .ix{position:absolute;left:calc(var(--w)*.06);top:calc(var(--w)*.05);display:flex;flex-direction:column;align-items:center;min-width:calc(var(--w)*.3);font-weight:800;font-size:calc(var(--w)*.3);line-height:.92;letter-spacing:-.05em}
.card .ix i{font-style:normal;font-weight:400;font-size:calc(var(--w)*.25);line-height:1;margin-top:2px;letter-spacing:0}
.card .pip{position:absolute;right:calc(var(--w)*.08);bottom:calc(var(--w)*.03);font-size:calc(var(--w)*.56);line-height:1}
.card.ace .pip{right:auto;left:50%;bottom:50%;translate:-50% 50%;font-size:calc(var(--w)*.72)}
.card.court::before{content:"";position:absolute;top:calc(var(--w)*.14);right:calc(var(--w)*.09);bottom:calc(var(--w)*.09);left:calc(var(--w)*.42);border:1.5px solid var(--gold);border-radius:calc(var(--w)*.06);opacity:.75}
.card .court-l{position:absolute;right:calc(var(--w)*.14);top:calc(var(--w)*.2);font-weight:800;font-size:calc(var(--w)*.34);line-height:1;opacity:.28}
.card.dim{filter:brightness(.55) saturate(.6)}
.card.sel{--lift:-16px;box-shadow:0 0 0 3px var(--turq),0 10px 18px rgba(0,0,0,.45)}
#ncards .card.sel{--lift:-8px}
.card.hint{animation:hintp 1s ease-in-out 2}
@keyframes hintp{50%{box-shadow:0 0 0 4px var(--gold),0 0 22px 4px rgba(226,182,89,.65)}}
.card.shake{animation:shake .32s}
@keyframes shake{20%{translate:-6px var(--lift,0px)}40%{translate:6px var(--lift,0px)}60%{translate:-4px var(--lift,0px)}80%{translate:4px var(--lift,0px)}}
.card.deal{animation:deal .38s cubic-bezier(.2,.8,.2,1) both}
@keyframes deal{from{opacity:0;translate:0 -60px}}

/* Bildirim */
#toast{position:absolute;left:50%;top:62px;translate:-50% -8px;z-index:30;width:max-content;max-width:calc(100% - 32px);padding:9px 14px;border-radius:12px;background:var(--ivory);color:var(--ink);font-size:13px;font-weight:700;line-height:1.35;box-shadow:0 6px 20px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .18s,translate .18s;text-align:center;text-wrap:balance}
#toast.show{opacity:1;translate:-50% 0}
#toast.warn{background:#fbe4dd;color:#7c1d14}

/* Pencereler */
.overlay{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:rgba(5,12,26,.62)}
.panel{width:min(100%,380px);max-height:100%;overflow:auto;background:var(--ivory);color:var(--ink);border-radius:18px;padding:20px 18px;box-shadow:0 20px 50px rgba(0,0,0,.5);-webkit-user-select:text;user-select:text}
.panel h2{font:800 27px/1.1 "Alegreya",Georgia,serif;margin:4px 0 8px;text-wrap:balance}
.panel h3{font:800 18px/1.2 "Alegreya",Georgia,serif;margin:18px 0 6px}
.panel .eb{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#96680f}
.panel p{margin:0 0 12px;font-size:14px;color:var(--paper-ink)}
.panel .btn{width:100%}
.panel .row{display:flex;gap:8px}
.panel .row .btn{flex:1}
.res{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin-bottom:16px}
.res th{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#6b7390;text-align:right;font-weight:800;padding:6px 4px;border-bottom:1px solid var(--paper-line)}
.res td{padding:9px 4px;text-align:right;font-weight:700;border-bottom:1px solid var(--paper-line);font-size:14px}
.res td:first-child,.res th:first-child{text-align:left}
.res tfoot td{border-bottom:0;font-weight:800}
.pos{color:#17625f}.neg{color:var(--red)}
.note{font-size:12px;color:#6b7390;margin:-6px 0 14px}
.sheet{place-items:end center;padding:0}
.sheet .panel{width:min(100%,520px);border-radius:20px 20px 0 0;max-height:90%;padding:12px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.grab{width:40px;height:4px;border-radius:2px;background:#cdbf9f;margin:0 auto 14px}
.set{display:flex;flex-direction:column;gap:6px;padding-block:10px;border-bottom:1px solid var(--paper-line)}
.set .lb{font-size:13px;font-weight:700;color:var(--paper-ink)}
.seg{display:flex;background:#ebe1c9;border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;min-width:0;height:38px;border:0;border-radius:8px;background:transparent;font-weight:700;font-size:13px;color:#4a536d}
.seg button[aria-pressed="true"]{background:#fffdf7;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.confirm{background:#fbe4dd;border-radius:12px;padding:12px;margin-top:10px}
.confirm p{margin:0 0 10px;color:#7c1d14;font-weight:700}
.rules ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.rules li,.rules p{font-size:14px;color:var(--paper-ink);line-height:1.45}
.rules b{color:var(--ink)}
.sheet-foot{margin-top:16px}
.empty{font-size:13px;color:#6b7390}

@media (min-width:700px){
  :root{--side:92px}
  .nm{font-size:14px}
}
@media (prefers-reduced-motion:reduce){
  .card,.btn,.medallion,#toast{transition:none}
  .card.deal,.card.hint,.turn .av::after{animation:none}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <button id="scoreBtn" class="score" aria-label="Skor tablosu">
      <span class="t us"><small>Biz</small><b id="sUs">0</b></span>
      <span class="t them"><small>Onlar</small><b id="sThem">0</b></span>
    </button>
    <div id="info" class="info" aria-live="polite"></div>
    <button id="lastBtn" class="icon" aria-label="Son eli göster" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="4" y="6" width="10" height="14" rx="2" transform="rotate(-10 9 13)"/><rect x="10" y="4" width="10" height="14" rx="2"/></svg>
    </button>
    <button id="menuBtn" class="icon" aria-label="Menü">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </header>
  <section id="north" aria-label="Kuzey"><div id="northSeat"></div><div id="ncards" class="cards" hidden></div></section>
  <section id="mid">
    <div id="west" class="side" aria-label="Batı"></div>
    <div id="table">
      <div class="medallion" aria-hidden="true"><i></i><i></i></div>
      <div id="cmsg"></div>
      <div id="trick"></div>
      <div id="stag"></div>
      <div id="lastCap" hidden></div>
    </div>
    <div id="east" class="side" aria-label="Doğu"></div>
  </section>
  <div id="actions"></div>
  <section id="south" aria-label="Senin elin"><div id="hand" class="cards"></div></section>
  <div id="toast" role="status" aria-live="polite"></div>
</div>
<div id="modal" class="overlay" hidden></div>
<div id="sheet" class="overlay sheet" hidden></div>
<noscript>Bu oyun için JavaScript gerekir.</noscript>

<script>
'use strict';
/* ---------- Sabitler ---------- */
const SYM = ['♠︎', '♥︎', '♣︎', '♦︎'];
const SUIT_NAME = ['Maça', 'Kupa', 'Sinek', 'Karo'];
const RANK_NAME = { 11: 'Vale', 12: 'Kız', 13: 'Papaz', 14: 'As' };
const RED = [false, true, false, true];
const suit = c => Math.floor(c / 13);
const rank = c => c % 13 + 2;
const RL = r => ({ 11: 'J', 12: 'Q', 13: 'K', 14: 'A' })[r] || String(r);
const cardLabel = c => `${SUIT_NAME[suit(c)]} ${RANK_NAME[rank(c)] || rank(c)}`;

// 0 Güney (sen), 1 Doğu (sağ), 2 Kuzey (eşin), 3 Batı (sol). Oyun sağa, saat yönünün tersine döner.
const NAME = ['Sen', 'Kemal', 'Selin', 'Deniz'];
const ROLE = ['', 'Sağ rakip', 'Eşin', 'Sol rakip'];
const LOC = ['sende', "Kemal'de", "Selin'de", "Deniz'de"];
const SEAT_ID = ['south', 'east', 'north', 'west'];
const TEAM = ['Biz', 'Onlar'];
const nxt = p => (p + 1) % 4;
const prt = p => (p + 2) % 4;
const team = p => p % 2;

const DEF_SET = { target: 51, minBid: 8, speed: 'normal', tap: 'double', legalHint: true, def2: true, bidHint: true };
const SPEEDS = {
  slow: { ai: 1100, trick: 1500, col: 460 },
  normal: { ai: 700, trick: 1050, col: 380 },
  fast: { ai: 340, trick: 620, col: 260 }
};
const LS_SET = 'esli-batak-ayar-v1';
const LS_GAME = 'esli-batak-oyun-v1';
function lsGet(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* depolama yoksa sorun değil */ } }

let SET = Object.assign({}, DEF_SET, lsGet(LS_SET) || {});
const T = () => SPEEDS[SET.speed] || SPEEDS.normal;
const reduceMotion = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();

let S = null;          // oyun durumu (kaydedilir)
let AUTO = false;      // true olursa bütün koltukları bilgisayar oynar
let epoch = 0, running = false, skipWait = null;
const UI = { sel: null, hint: null, viewLast: false, dealAnim: false, sheet: null, confirmNew: false };
const $ = s => document.querySelector(s);
const fmt1 = x => (Math.round(x * 2) / 2).toFixed(1).replace('.', ',').replace(',0', '');
const fmtNum = x => x < 0 ? `−${-x}` : String(x);
const fmtPts = x => x > 0 ? `+${x}` : fmtNum(x);

/* ---------- Oyun durumu ---------- */
function randInt(n) {
  try { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
  catch (e) { return Math.floor(Math.random() * n); }

function shuffled() {
  const d = Array.from({ length: 52 }, (_, i) => i);
  for (let i = 51; i > 0; i--) { const j = randInt(i + 1); [d[i], d[j]] = [d[j], d[i]]; }
  return d;
}
function save() { lsSet(LS_GAME, S); }

function newGame() {
  S = { v: 1, scores: [0, 0], hist: [], handNo: 0, dealer: randInt(4) };
  startHand(true);
}
function startHand(first) {
  if (!first) S.dealer = nxt(S.dealer);
  S.handNo++;
  const d = shuffled();
  S.hands = [0, 1, 2, 3].map(p => d.slice(p * 13, p * 13 + 13));
  S.phase = 'bid';
  S.bids = [null, null, null, null];
  S.firstBid = [null, null, null, null];
  S.passed = [false, false, false, false];
  S.high = 0; S.highBy = -1;
  S.turn = nxt(S.dealer);

  S.trump = null; S.dummy = -1; S.broken = false;
  S.trick = []; S.tricks = [0, 0, 0, 0]; S.last = null; S.played = [];
  S.voids = [0, 1, 2, 3].map(() => [false, false, false, false]);
  S.caps = [0, 1, 2, 3].map(() => [15, 15, 15, 15]);
  UI.sel = null; UI.hint = null; UI.viewLast = false; UI.dealAnim = true;

}

/* ---------- Kurallar ---------- */
function beats(c, w, tr) { return suit(c) === suit(w) ? rank(c) > rank(w) : suit(c) === tr; }

  let b = trick[0];
  for (let i = 1; i < trick.length; i++) if (beats(trick[i].c, b.c, tr)) b = trick[i];
  return b;
}
function legal(hand, trick, tr, broken) {
  if (!trick.length) {
    if (!broken) { const nt = hand.filter(c => suit(c) !== tr); if (nt.length) return nt; }
    return hand.slice();
  }
  const led = suit(trick[0].c), w = winnerOf(trick, tr).c;
  const f = hand.filter(c => suit(c) === led);
  if (f.length) {
    if (suit(w) === led) { const h = f.filter(c => rank(c) > rank(w)); if (h.length) return h; }
    return f;
  }
  const t = hand.filter(c => suit(c) === tr);
  if (t.length) {
    if (suit(w) === tr) { const h = t.filter(c => rank(c) > rank(w)); if (h.length) return h; }
    return t;
  }
  return hand.slice();
}
function whyIllegal(hand, c, trick, tr) {
  if (!trick.length) return `Koz henüz açılmadı. Elinde başka renk varken ${SYM[tr]} ile başlayamazsın.`;
  const led = suit(trick[0].c), w = winnerOf(trick, tr).c;
  if (hand.some(x => suit(x) === led)) {
    if (suit(c) !== led) return `Yerdeki renkten (${SYM[led]}) atmalısın.`;
    return `Yükseltmek zorunlu: ${SYM[led]}${RL(rank(w))} üstünde bir kart atmalısın.`;
  }
  if (suit(c) !== tr) return `Elinde ${SYM[led]} yok, koz (${SYM[tr]}) çakmalısın.`;
  return `Yerdeki kozu geçmelisin: ${SYM[tr]}${RL(rank(w))} üstünde bir koz at.`;
}
const ctrl = p => (S.dummy >= 0 && p === S.dummy) ? S.bidder : p;
const isHuman = p => !AUTO && ctrl(p) === 0;
function canAct(p) {

}
function teamTricks() { return [S.tricks[0] + S.tricks[2], S.tricks[1] + S.tricks[3]]; }

/* ---------- İhale ---------- */
function doBid(p, v) {
  S.bids[p] = v === 0 ? 'pas' : v;
  if (v === 0) S.passed[p] = true; else { S.high = v; S.highBy = p; }
  if (v && S.firstBid && S.firstBid[p] == null) S.firstBid[p] = v;
  const active = [0, 1, 2, 3].filter(i => !S.passed[i]);
  if (v === 13) return endBidding(p, 13, false);
  if (!active.length) return endBidding(S.dealer, 7, true);
  if (S.highBy >= 0 && active.length === 1 && active[0] === S.highBy) return endBidding(S.highBy, S.high, false);
  let t = nxt(p);
  while (S.passed[t]) t = nxt(t);
  S.turn = t;
  save();
}
function endBidding(p, v, forced) {
  S.bidder = p; S.contract = v; S.forced = forced;
  S.phase = 'trump'; S.turn = p;
  toast(forced ? `Herkes pas dedi. İhale 7 ile ${LOC[p]}.` : `İhale ${LOC[p]}: ${v}`);
  save();
}
function chooseTrump(s) {
  S.trump = s; S.dummy = prt(S.bidder);
  S.phase = 'play'; S.turn = S.bidder;
  const k = `Koz ${SYM[s]} ${SUIT_NAME[s]}.`;
  if (S.dummy === 0) toast(`${k} Elin açıldı, kartlarını Selin oynayacak.`);
  else if (S.bidder === 0) toast(`${k} Selin elini açtı. Onun kartlarını da sen oynayacaksın.`);
  else toast(`${k} ${NAME[S.dummy]} elini açtı.`);
  save();
}

/* ---------- Oynama ---------- */
function infer(p, c) {
  const tr = S.trump, s = suit(c);
  if (!S.trick.length) {
    if (s === tr && !S.broken) for (let x = 0; x < 4; x++) if (x !== tr) S.voids[p][x] = true;
    return;
  }
  const led = suit(S.trick[0].c), w = winnerOf(S.trick, tr).c;
  if (s !== led) {
    S.voids[p][led] = true;
    if (s !== tr) S.voids[p][tr] = true;
    else if (suit(w) === tr && rank(c) < rank(w)) S.caps[p][tr] = Math.min(S.caps[p][tr], rank(w));
  } else if (suit(w) === led && rank(c) < rank(w)) {
    S.caps[p][led] = Math.min(S.caps[p][led], rank(w));
  }
}
function playCard(p, c, fromRect) {
  const from = fromRect || srcRect(p, c);
  infer(p, c);
  const firstTrump = !S.broken && suit(c) === S.trump;
  S.hands[p] = S.hands[p].filter(x => x !== c);
  S.trick.push({ p, c });
  S.played.push(c);
  if (suit(c) === S.trump) S.broken = true;
  if (S.trick.length < 4) S.turn = nxt(p);
  UI.sel = null; UI.hint = null; UI.viewLast = false;
  save();
  render();
  const el = document.querySelector(`#trick .card[data-card="${c}"]`);
  if (el) flyFrom(el, from);
  if (firstTrump) toast('Koz açıldı!');
}
async function collectTrick(my) {
  const w = winnerOf(S.trick, S.trump).p;
  if (!reduceMotion) {
    const to = anchorPoint(w);
    document.querySelectorAll('#trick .card').forEach(el => {
      const r = el.getBoundingClientRect();
      el.style.transition = `transform ${T().col}ms ease-in, opacity ${T().col}ms ease-in`;
      el.style.transform = `translate(${to.x - (r.left + r.width / 2)}px, ${to.y - (r.top + r.height / 2)}px) scale(.35)`;
      el.style.opacity = '0';
    });
    await pause(T().col);
    if (my !== epoch) return;
  }
  S.tricks[w]++;
  S.last = { cards: S.trick.slice(), w };
  S.trick = [];
  S.turn = w;
  if (S.hands.every(h => !h.length)) endHand();
  save();
  render();
}
function endHand() {
  const bt = team(S.bidder), dt = 1 - bt;
  const tt = teamTricks();
  const made = tt[bt] >= S.contract;
  const pts = [0, 0];
  pts[bt] = made ? tt[bt] : -S.contract;
  const defPen = SET.def2 && tt[dt] < 2;
  pts[dt] = defPen ? -S.contract : tt[dt];
  S.scores[0] += pts[0]; S.scores[1] += pts[1];
  S.hist.push({ n: S.handNo, bidder: S.bidder, contract: S.contract, trump: S.trump, tricks: tt, pts, made, defPen, forced: S.forced });
  const tgt = SET.target;
  const over = (S.scores[0] >= tgt || S.scores[1] >= tgt) && S.scores[0] !== S.scores[1];
  S.phase = over ? 'gameEnd' : 'handEnd';
}

/* ---------- Yapay zekâ ---------- */
function evalHand(h, t) {
  const by = [[], [], [], []];
  h.forEach(c => by[suit(c)].push(rank(c)));
  const tl = by[t].length;
  let v = 0, short = 0;
  for (let s = 0; s < 4; s++) {
    const a = by[s], n = a.length, has = r => a.includes(r);
    if (s === t) {
      if (has(14)) v += 1;
      if (has(13)) v += n >= 2 ? (has(14) ? 1 : 0.8) : 0.3;
      if (has(12)) v += n >= 3 ? 0.65 : 0.2;
      if (has(11)) v += n >= 4 ? 0.35 : 0;
      v += Math.max(0, n - 3) * 0.85;
    } else {
      if (has(14)) v += n <= 5 ? 0.95 : 0.75;
      if (has(13)) v += n >= 2 ? (has(14) ? 0.8 : 0.55) : 0.2;
      if (has(12)) v += n >= 3 ? (has(14) && has(13) ? 0.55 : 0.25) : 0.05;
      if (tl >= 3) short += n === 0 ? 0.9 : n === 1 ? 0.5 : n === 2 ? 0.15 : 0;
    }
  }
  return v + Math.min(short, Math.max(0, tl - 2) * 0.8);
}
function bestSuit(h) {
  let b = 0, bv = -1;
  for (let s = 0; s < 4; s++) {
    const v = evalHand(h, s) + 0.05 * h.filter(c => suit(c) === s).length;
    if (v > bv) { bv = v; b = s; }
  }
  return { s: b, v: evalHand(h, b) };
}
// Eşin katkısı: benzetimlerde ortalama ≈ 3,2 el. Eşin ilk teklifi elinin gücünü gösterir;
// sonraki teklifleri bizim teklifimize dayandığı için hesaba katılmaz (karşılıklı şişmeyi önler).
function partnerGuess(p) {
  const q = prt(p), fb = (S.firstBid || [])[q];
  let pe = 3.2;
  if (typeof fb === 'number') pe = Math.max(3.2, 0.85 * (fb - 3.2) + 1);
  else if (S.bids[q] === 'pas') pe = 2.8;
  const ob = [S.bids[nxt(p)], S.bids[(p + 3) % 4]].filter(x => typeof x === 'number');
  if (ob.length) pe -= 0.25 * (Math.max(...ob) - 7);
  return Math.max(1.5, pe);
}
function aiBid(p) {
  const need = S.high ? S.high + 1 : SET.minBid;
  if (need > 13) return 0;
  const own = bestSuit(S.hands[p]).v;
  const est = own + partnerGuess(p) + (Math.random() - 0.5) * 0.7;
  if (S.highBy === prt(p)) return (own >= 6.5 && est >= need + 1) ? need : 0;

const aiTrump = p => bestSuit(S.hands[p]).s;

function know(viewer) {

  const seen = new Set(S.played);
  known.forEach(h => h && h.forEach(c => seen.add(c)));
  const pool = [];
  for (let c = 0; c < 52; c++) if (!seen.has(c)) pool.push(c);

}
function may(K, q, c) {
  if (K.known[q]) return K.known[q].includes(c);
  if (!K.pool.includes(c)) return false;
  const s = suit(c);
  return !S.voids[q][s] && rank(c) < S.caps[q][s];
}
function mayAny(K, q, pred) {

function mayCount(K, q, pred) {

}
// q oyuncusu yerdeki en büyük kart w'yu geçebilir mi?
function canBeat(K, q, w, led) {
  const tr = S.trump;
  const ledCnt = mayCount(K, q, c => suit(c) === led);

    const h = K.known[q];
    if (ledCnt) return suit(w) === led && h.some(c => suit(c) === led && rank(c) > rank(w));

    if (mayAny(K, q, c => suit(c) === led && rank(c) > rank(w))) return true;

    return false;

function safeWith(K, seat, c) {

  const w = winnerOf(tr, S.trump);
  if (team(w.p) !== team(seat)) return false;
  let q = seat;
  for (let i = 0; i < 4 - tr.length; i++) {

function isTop(K, seat, c) {
  const s = suit(c), opp = [nxt(seat), (seat + 3) % 4];
  for (let r = rank(c) + 1; r <= 14; r++) {

    if (S.played.includes(x)) continue;
    if (opp.some(q => may(K, q, x))) return false;

function suitLen(seat, s) { return S.hands[seat].filter(c => suit(c) === s).length; }
function worth(K, seat, c) {

  let v = rank(c);

  if (isTop(K, seat, c)) v += 12;
  const n = suitLen(seat, suit(c)), tl = suitLen(seat, tr);

}
function cheapest(K, seat, cards) { return cards.slice().sort((a, b) => worth(K, seat, a) - worth(K, seat, b))[0]; }
// c ile aynı değerde olan (arada dışarıda kart kalmamış) en küçük kart
function lowestEquiv(seat, c, cands) {
  const s = suit(c), mine = new Set(S.hands[seat]);
  let best = c;
  for (let r = rank(c) - 1; r >= 2; r--) {
    const x = s * 13 + r - 2;
    if (S.played.includes(x)) continue;
    if (mine.has(x)) { if (cands.includes(x)) best = x; continue; }
    break;
  }
  return best;

function chooseLead(seat, lg, K) {
  const tr = S.trump, me = team(seat), bidTeam = team(S.bidder) === me;
  const opp = [nxt(seat), (seat + 3) % 4], pt = prt(seat);
  const oppTrump = opp.some(q => mayAny(K, q, c => suit(c) === tr));
  const ruffRisk = s => s !== tr && opp.some(q => !mayAny(K, q, c => suit(c) === s) && mayAny(K, q, c => suit(c) === tr));
  const trs = lg.filter(c => suit(c) === tr).sort((a, b) => rank(b) - rank(a));
  const side = lg.filter(c => suit(c) !== tr);
  // 1) İhaleci takım en büyük kozu elindeyse kozları toplar
  if (bidTeam && oppTrump && trs.length) {
    const top = trs.find(c => isTop(K, seat, c));
    if (top !== undefined) return lowestEquiv(seat, top, trs);
  }
  // 2) Kesilme riski olmayan büyük kartlar
  const tops = side.filter(c => isTop(K, seat, c) && !ruffRisk(suit(c)));
  if (tops.length) {
    tops.sort((a, b) => suitLen(seat, suit(b)) - suitLen(seat, suit(a)) || rank(b) - rank(a));
    return lowestEquiv(seat, tops[0], side);
  }
  // 3) Eşin o renkte yoksa ve kozu varsa, çaksın diye küçük kart
  if (side.length && mayAny(K, pt, c => suit(c) === tr)) {
    for (let s = 0; s < 4; s++) {
      if (s === tr) continue;
      const mine = side.filter(c => suit(c) === s);
      if (!mine.length) continue;
      if (!mayAny(K, pt, c => suit(c) === s) && !ruffRisk(s)) return mine.sort((a, b) => rank(a) - rank(b))[0];
    }
  }
  // 4) En uygun renkten küçük kart
  if (side.length) {
    let best = null, bs = -1e9;
    for (let s = 0; s < 4; s++) {
      if (s === tr) continue;
      const mine = side.filter(c => suit(c) === s).sort((a, b) => rank(a) - rank(b));
      if (!mine.length) continue;
      let sc = mine.length * 2;
      if (ruffRisk(s)) sc -= 8;
      const hi = rank(mine[mine.length - 1]);

      if (sc > bs) { bs = sc; best = mine[0]; }
    }

function chooseFollow(seat, lg, K) {
  const tr = S.trump, led = suit(S.trick[0].c), cur = winnerOf(S.trick, tr), me = team(seat);
  const after = [];

  for (let i = 0; i < 3 - S.trick.length; i++) { q = nxt(q); after.push(q); }
  const oppAfter = after.filter(x => team(x) !== me);
  const partnerAfter = after.some(x => team(x) === me);
  const winners = lg.filter(c => beats(c, cur.c, tr)).sort((a, b) => rank(a) - rank(b));
  const safe = winners.filter(c => safeWith(K, seat, c));
  if (team(cur.p) === me) {
    if (oppAfter.every(x => !canBeat(K, x, cur.c, led))) return cheapest(K, seat, lg);
    if (safe.length) return safe[0];
    return cheapest(K, seat, lg);
  }
  if (safe.length) return safe[0];
  if (winners.length && !partnerAfter) {
    if (oppAfter.length && oppAfter.every(x => K.known[x])) return cheapest(K, seat, lg);

  const lg = legal(S.hands[seat], S.trick, S.trump, S.broken);
  if (lg.length === 1) return lg[0];
  const K = know(ctrl(seat));
  return S.trick.length ? chooseFollow(seat, lg, K) : chooseLead(seat, lg, K);

/* ---------- Akış ---------- */
function sleep(ms) {
  return new Promise(res => {
    let done = false;
    const fin = () => { if (done) return; done = true; clearTimeout(t); if (skipWait === fin) skipWait = null; res(); };
    const t = setTimeout(fin, ms);
    skipWait = fin;
  });
}
const pause = ms => new Promise(res => setTimeout(res, ms));

async function loop() {
  if (running || !S) return;
  running = true;
  const my = epoch;
  try {
    for (;;) {
      if (my !== epoch) return;
      if (S.phase === 'bid') {
        if (isHuman(S.turn)) break;
        render(); await sleep(T().ai); if (my !== epoch) return;
        doBid(S.turn, aiBid(S.turn)); continue;
      }
      if (S.phase === 'trump') {
        if (isHuman(S.bidder)) break;
        render(); await sleep(T().ai * 1.2); if (my !== epoch) return;
        chooseTrump(aiTrump(S.bidder)); continue;
      }
      if (S.phase === 'play') {
        if (S.trick.length === 4) {
          render(); await sleep(T().trick); if (my !== epoch) return;
          await collectTrick(my); continue;
        }
        if (isHuman(S.turn)) break;
        render(); await sleep(T().ai); if (my !== epoch) return;
        playCard(S.turn, aiPlay(S.turn)); continue;
      }
      if (AUTO && S.phase === 'handEnd') { startHand(false); continue; }
      break;
    }
  } finally {
    if (my === epoch) running = false;
  }
  if (my === epoch) render();
}

/* ---------- Oyuncu girdileri ---------- */
function humanBid(v) {
  if (running || S.phase !== 'bid' || !isHuman(S.turn)) return;
  const need = Math.max(SET.minBid, S.high + 1);
  if (v !== 0 && (v < need || v > 13)) return;
  doBid(S.turn, v);
  loop();
}
function humanTrump(s) {
  if (running || S.phase !== 'trump' || !isHuman(S.bidder)) return;
  chooseTrump(s);
  loop();
}
function onCardTap(seat, c, el) {
  if (!canAct(seat)) {
    if (S.phase === 'play' && seat === 0 && S.dummy === 0) toast('Açık elini Selin oynuyor.');
    else if (S.phase === 'play' && seat === 0 && S.turn === 2 && isHuman(2) && !running) toast("Sıra Selin'in açık elinde. Üstteki kartlardan seç.");
    return;
  }
  const lg = legal(S.hands[seat], S.trick, S.trump, S.broken);
  if (!lg.includes(c)) {
    shake(el);
    toast(whyIllegal(S.hands[seat], c, S.trick, S.trump), true);
    if (UI.sel !== null) { UI.sel = null; render(); }
    return;
  }
  if (SET.tap === 'single' || UI.sel === c) {
    playCard(seat, c, el.getBoundingClientRect());
    loop();
  } else {
    UI.sel = c; UI.hint = null;
    render();
  }
}
function onCardDrop(seat, c, el, rect) {

function suitOrder(h) {
  const present = [0, 1, 2, 3].filter(s => h.some(c => suit(c) === s));
  if (!present.length) return [];
  const out = [];
  let rest = present.slice();
  let first = S.trump != null && rest.includes(S.trump) ? S.trump : rest[0];
  out.push(first); rest = rest.filter(s => s !== first);
  while (rest.length) {
    const lastRed = RED[out[out.length - 1]];
    const n = rest.find(s => RED[s] !== lastRed);
    const pick = n !== undefined ? n : rest[0];
    out.push(pick); rest = rest.filter(s => s !== pick);
  }
  return out;
}
function sortHand(h) {

}

    if (p === S.dummy) out.push('<span class="chip open">Açık</span>');

}

function splitRows(cards, perMax) {

  let best = mid, bd = 1e9;
  for (let k = 1; k < n; k++) {

    if (k > perMax || n - k > perMax) continue;
    const d = Math.abs(n - 2 * k);

  { k: 'legalHint', label: 'Oynanamayan kartları soldur', opts: [[true, 'Açık'], [false, 'Kapalı']] },
  { k: 'bidHint', label: 'İhalede el gücü ipucu', opts: [[true, 'Açık'], [false, 'Kapalı']] },
  { k: 'def2', label: 'Karşı takım en az 2 el almalı', opts: [[true, 'Açık'], [false, 'Kapalı']] }
];
function histHTML() {
  if (!S.hist.length) return '<p class="empty">Henüz biten el yok.</p>';
  const rows = S.hist.map(r => `<tr><td>${r.n}</td><td>${NAME[r.bidder]} ${r.contract}${SYM[r.trump]}${r.made ? '' : ' · battı'}</td>` +
    `<td class="${r.pts[0] < 0 ? 'neg' : ''}">${fmtPts(r.pts[0])}</td><td class="${r.pts[1] < 0 ? 'neg' : ''}">${fmtPts(r.pts[1])}</td></tr>`).join('');
  return `<table class="res"><thead><tr><th>El</th><th>İhale</th><th>Biz</th><th>Onlar</th></tr></thead><tbody>${rows}</tbody>` +
    `<tfoot><tr><td></td><td>Toplam</td><td>${fmtNum(S.scores[0])}</td><td>${fmtNum(S.scores[1])}</td></tr></tfoot></table>`;
}
const RULES_HTML = `
<div class="rules">
<h2>Eşli açmalı ihaleli batak</h2>
<p>Karşılıklı oturanlar eştir: <b>Sen ve Selin</b> (Biz), <b>Kemal ve Deniz</b> (Onlar). Her oyuncuya 13 kart dağıtılır. Oyun sağa doğru, saat yönünün tersine döner; dağıtıcılık her el bir sağa geçer.</p>
<h3>İhale</h3>
<ul>
<li>İhale dağıtanın sağındaki oyuncudan başlar. Takımınızın kaç el alacağını söylersiniz; en az 8 (ayarlardan 7 yapılabilir), en çok 13.</li>
<li>Her teklif bir öncekinden büyük olmalı. Pas diyen o elde ihaleye dönemez.</li>
<li>Herkes pas derse ihale 7 ile dağıtana kalır.</li>
</ul>
<h3>Koz ve açık el</h3>
<ul>
<li>İhaleyi alan kozu seçer ve ilk kartı o atar.</li>
<li>Koz seçilince ihaleyi alanın eşi kartlarını masaya açar. Açılan eli de ihaleyi alan oynar.</li>
<li>İhaleyi sen alırsan Selin'in kartları üstte açılır; sırası gelince onun kartını da sen seçersin. Selin alırsa senin elin açılır ve onu Selin oynar.</li>
</ul>
<h3>Kart atma</h3>
<ul>
<li>Yerdeki renkten atmak zorunludur.</li>
<li>Yükseltmek zorunludur: elinde yerdeki en büyük kartı geçen kart varsa onu atmalısın, eşinin kartı olsa bile.</li>
<li>O renk yoksa koz çakmak zorunludur. Yerde koz varsa ve elinde daha büyüğü varsa onu atmalısın.</li>
<li>Koz da yoksa istediğin kartı atabilirsin.</li>
<li>Koz açılmadan, yani yere hiç koz düşmeden kozla ele başlanamaz. Elinde yalnızca koz kaldıysa başlayabilirsin.</li>
</ul>
<h3>Puan</h3>
<ul>
<li>İhaleyi alan takım söylediği kadar ya da daha fazla el alırsa aldığı el kadar puan yazar.</li>
<li>Alamazsa ihale kadar eksi yazar (batar).</li>
<li>Karşı takım aldığı el kadar puan yazar. "En az 2 el" kuralı açıksa 2 elden az alırsa ihale kadar eksi yazar.</li>
<li>El sonunda hedef puana ulaşan takımlardan puanı yüksek olan kazanır.</li>
</ul>
<h3>Dokunmatik kontroller</h3>
<ul>
<li>Karta dokun, kart kalkar. Tekrar dokun ya da yukarı kaydır, kart oynanır. Ayarlardan tek dokunuşla oynamayı seçebilirsin.</li>
<li>Soluk kartlar o an oynanamaz. Dokunursan nedenini yazar.</li>
<li>Masaya dokunmak bekleme süresini kısaltır. Üstteki kart simgesi son eli gösterir.</li>
<li>Oyun bu cihazda kendiliğinden kaydedilir; sayfayı kapatıp açınca kaldığın yerden devam eder.</li>
</ul>
</div>`;
function openSheet(view) { UI.sheet = view; UI.confirmNew = false; renderSheet(); }
function closeSheet() { UI.sheet = null; UI.confirmNew = false; const sh = $('#sheet'); sh.hidden = true; sh.innerHTML = ''; }
function renderSheet() {
  const sh = $('#sheet');
  if (!UI.sheet) { sh.hidden = true; return; }
  let body = '';
  if (UI.sheet === 'rules') {
    body = RULES_HTML + '<div class="sheet-foot row"><button class="btn ghost" data-act="menu" style="color:var(--ink)">Geri</button><button class="btn primary" data-act="close">Oyuna dön</button></div>';
  } else if (UI.sheet === 'scores') {
    body = `<div class="eb">El ${S.handNo} · Hedef ${SET.target}</div><h2>Skor tablosu</h2>${histHTML()}` +
      '<div class="sheet-foot"><button class="btn primary" data-act="close">Oyuna dön</button></div>';
  } else {
    const sets = SETTINGS.map(st => `<div class="set"><span class="lb" id="lb-${st.k}">${st.label}</span><div class="seg" role="group" aria-labelledby="lb-${st.k}">` +
      st.opts.map(([v, l]) => `<button id="set-${st.k}-${String(v)}" data-k="${st.k}" data-v='${JSON.stringify(v)}' aria-pressed="${SET[st.k] === v}">${l}</button>`).join('') +
      '</div></div>').join('');
    body = '<div class="eb">Menü</div><h2>Eşli Açmalı Batak</h2>' +
      '<div class="row"><button class="btn primary" data-act="ask-new">Yeni oyun</button><button class="btn" data-act="rules">Kurallar</button></div>' +
      (UI.confirmNew ? '<div class="confirm"><p>Bu oyun silinip yeni oyun başlasın mı?</p><div class="row"><button class="btn" data-act="cancel-new">Vazgeç</button><button class="btn primary" data-act="new">Yeni oyun başlat</button></div></div>' : '') +
      `<h3>Ayarlar</h3>${sets}<h3>Skor tablosu</h3>${histHTML()}` +
      '<div class="sheet-foot"><button class="btn primary" data-act="close">Oyuna dön</button></div>';
  }
  const scroll = sh.querySelector('.panel') ? sh.querySelector('.panel').scrollTop : 0;
  sh.innerHTML = `<div class="panel" role="dialog" aria-modal="true" aria-label="Menü"><div class="grab" aria-hidden="true"></div>${body}</div>`;
  sh.hidden = false;
  if (UI.sheet === 'menu') sh.querySelector('.panel').scrollTop = scroll;
}

/* ---------- Başlatma ---------- */
function doNewGame() {
  epoch++;
  running = false;
  if (skipWait) { const f = skipWait; skipWait = null; f(); }
  newGame();
  closeSheet();
  render();
  loop();
}
function doNextHand() {
  if (S.phase !== 'handEnd') return;
  startHand(false);
  render();
  loop();
}
function onAction(act) {
  if (act === 'next') doNextHand();
  else if (act === 'new') doNewGame();
  else if (act === 'ask-new') { UI.confirmNew = true; renderSheet(); }
  else if (act === 'cancel-new') { UI.confirmNew = false; renderSheet(); }
  else if (act === 'rules') openSheet('rules');
  else if (act === 'menu') openSheet('menu');
  else if (act === 'close') closeSheet();
}
function bindUI() {
  bindCards($('#hand'), 0);
  bindCards($('#ncards'), 2);
  $('#actions').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.bid != null) humanBid(+b.dataset.bid);
    else if (b.dataset.trump != null) humanTrump(+b.dataset.trump);
    else if (b.id === 'hintBtn') showHint();
  });
  $('#table').addEventListener('click', () => {
    if (UI.viewLast) { UI.viewLast = false; render(); return; }
    if (skipWait) skipWait();
  });
  $('#lastBtn').addEventListener('click', () => {
    if (!S.last) return;
    UI.viewLast = !UI.viewLast;
    render();
  });
  $('#menuBtn').addEventListener('click', () => openSheet('menu'));
  $('#scoreBtn').addEventListener('click', () => openSheet('scores'));
  $('#modal').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b) onAction(b.dataset.act); });
  $('#sheet').addEventListener('click', e => {
    if (e.target === e.currentTarget) { closeSheet(); return; }
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.k) {
      SET[b.dataset.k] = JSON.parse(b.dataset.v);
      lsSet(LS_SET, SET);
      renderSheet();
      render();
    } else if (b.dataset.act) onAction(b.dataset.act);
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && UI.sheet) closeSheet(); });
  let rz = 0;
  addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(render); });
}
function validState(x) {
  return x && x.v === 1 && Array.isArray(x.hands) && x.hands.length === 4 && Array.isArray(x.scores) && typeof x.phase === 'string';
}
function start(data) {
  const saved = data && validState(data.S) ? data.S : lsGet(LS_GAME);
  if (validState(saved)) { S = saved; UI.dealAnim = false; }
  else newGame();
  bindUI();
  render();
  loop();
}
try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ S })); } catch (e) { /* yok say */ }
(function boot() {
  const hot = window.claude && window.claude.hot;
  if (hot && hot.ready) hot.ready(start);
  else start((hot && hot.data) || {});
})();
</script>
</body>
</html>
