<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b2440">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Öfkeli Kanatlar">
<title>Öfkeli Kanatlar</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hud-left">
      <button id="btnPause" class="icon-btn" aria-label="Duraklat">
        <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>
      </button>
      <button id="btnRestart" class="icon-btn" aria-label="Yeniden başlat">
        <svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7Z"/></svg>
      </button>
      <div id="levelName"></div>
    </div>
    <div id="scoreBox">
      <div class="label">SKOR</div>
      <div id="score">0</div>
      <div id="best">En iyi: 0</div>
    </div>
    <div id="hint"></div>
  </div>

  <!-- Yükleniyor -->
  <div id="loading" class="screen">
    <div class="sky-bg"></div>
    <canvas id="loadBird" class="load-bird" width="220" height="220"></canvas>
    <div class="logo small"><span class="l1">ÖFKELİ</span><span class="l2">KANATLAR</span></div>
    <div class="bar"><div id="loadBar"></div></div>
    <div class="load-text">Yükleniyor…</div>
  </div>

  <!-- Ana menü -->
  <div id="menu" class="screen hidden">
    <div class="menu-inner">
      <div class="logo-wrap">
        <canvas id="logoBird" class="logo-bird" width="260" height="260"></canvas>
        <div class="logo"><span class="l1">ÖFKELİ</span><span class="l2">KANATLAR</span></div>
      </div>
      <button id="btnPlay" class="play-btn" aria-label="Oyna">
        <svg viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.2-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z"/></svg>
        <span>OYNA</span>
      </button>
      <div class="menu-row">
        <button id="btnSfx" class="round-btn" aria-label="Ses efektleri">
          <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4Zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4Zm-2.5-9v2.1a7 7 0 0 1 0 13.8V21a9 9 0 0 0 0-18Z"/></svg>
        </button>
        <button id="btnMusic" class="round-btn" aria-label="Müzik">
          <svg viewBox="0 0 24 24"><path d="M9 18.5A2.5 2.5 0 1 1 7 16V5l12-2v12.5A2.5 2.5 0 1 1 17 13V7.3L9 8.6v9.9Z"/></svg>
        </button>
        <button id="btnFull" class="round-btn" aria-label="Tam ekran">
          <svg viewBox="0 0 24 24"><path d="M4 9V4h5v2H6v3H4Zm11-5h5v5h-2V6h-3V4ZM4 15h2v3h3v2H4v-5Zm14 3v-3h2v5h-5v-2h3Z"/></svg>
        </button>
      </div>
    </div>
    <div class="credit">Grafik &amp; ses: Kenney.nl (CC0) · Karakterler: prosedürel vektör</div>
  </div>

  <!-- Bölüm seçimi -->
  <div id="levels" class="screen hidden">
    <div class="levels-head">
      <button id="btnBack" class="icon-btn big" aria-label="Geri">
        <svg viewBox="0 0 24 24"><path d="M15.5 4.5 8 12l7.5 7.5 1.5-1.5-6-6 6-6-1.5-1.5Z"/></svg>
      </button>
      <h2>BÖLÜM SEÇ</h2>
    </div>
    <div id="levelCards"></div>
  </div>

  <!-- Duraklatma -->
  <div id="pause" class="overlay hidden">
    <div class="panel">
      <h2>DURAKLATILDI</h2>
      <button id="pResume" class="btn green">DEVAM ET</button>
      <button id="pRestart" class="btn orange">YENİDEN BAŞLA</button>
      <button id="pMenu" class="btn blue">BÖLÜMLER</button>
      <div class="menu-row">
        <button id="pSfx" class="round-btn small" aria-label="Ses"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4Zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4Zm-2.5-9v2.1a7 7 0 0 1 0 13.8V21a9 9 0 0 0 0-18Z"/></svg></button>
        <button id="pMusic" class="round-btn small" aria-label="Müzik"><svg viewBox="0 0 24 24"><path d="M9 18.5A2.5 2.5 0 1 1 7 16V5l12-2v12.5A2.5 2.5 0 1 1 17 13V7.3L9 8.6v9.9Z"/></svg></button>
      </div>
    </div>
  </div>

  <!-- Sonuç -->
  <div id="result" class="overlay hidden">
    <div class="panel">
      <div class="ribbon"><span id="resTitle">BÖLÜM TAMAMLANDI!</span></div>
      <div class="stars-row">
        <div class="star s1"></div><div class="star s2"></div><div class="star s3"></div>
      </div>
      <div id="resSub"></div>
      <div class="res-score-label">SKOR</div>
      <div id="resScore">0</div>
      <div id="resBest"></div>
      <div class="res-buttons">
        <button id="btnLevels" class="icon-btn big" aria-label="Bölümler"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4V4Zm9 0h7v7h-7V4ZM4 13h7v7H4v-7Zm9 0h7v7h-7v-7Z"/></svg></button>
        <button id="btnRetry" class="icon-btn big" aria-label="Tekrar"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7Z"/></svg></button>
        <button id="btnNext" class="icon-btn big green" aria-label="Sonraki"><svg viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.2-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z"/></svg></button>
      </div>
    </div>
  </div>

  <div id="rotate">
    <div class="phone"></div>
    <div>Daha iyi bir deneyim için telefonunu <b>yatay</b> çevir</div>
  </div>
</div>

<script src="js/matter.min.js"></script>
<script src="js/levels.js"></script>
<script src="js/world.js"></script>
<script src="js/art.js"></script>
<script src="js/audio.js"></script>
<script src="js/fx.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
</script>
</body>
</html>
