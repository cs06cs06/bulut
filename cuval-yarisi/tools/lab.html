<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Karakter Laboratuvarı</title>
<style>html,body{margin:0;height:100%;background:#223}canvas{display:block;width:100%;height:100%}#log{position:fixed;left:8px;top:8px;color:#fff;font:12px monospace;white-space:pre}</style>
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.js", "three/addons/": "../vendor/three/addons/" } }</script>
</head><body><canvas id="c"></canvas><div id="log"></div>
<script type="module">
import * as THREE from 'three';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { loadCharacterParts, createCharacter, bakePose } from '../js/characters.js';
import { HEROES, RIVALS } from '../js/config.js';
const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.setSize(innerWidth, innerHeight); renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x8fa6b8);
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 100);
const hdr = await new RGBELoader().loadAsync('../assets/hdri/ballawley_park_1k.hdr'); hdr.mapping = THREE.EquirectangularReflectionMapping;
const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromEquirectangular(hdr).texture; scene.environmentIntensity = 0.8;
const sun = new THREE.DirectionalLight(0xfff0d2, 2.5); sun.position.set(-3, 6, 4); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshStandardMaterial({ color: 0x6b8a3a })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const t0 = performance.now();
let parts = 0;
await loadCharacterParts(null, (p) => { parts++; return p; });
const genMs = Math.round(performance.now() - t0);
const chars = [];
const spec = [
  { sex: 'f', look: HEROES[0].look, clip: 'Idle_Loop', face: 'smile' },
  { sex: 'f', look: RIVALS[0].look, clip: 'Dance_Loop', face: 'joy' },
  { sex: 'm', lod: 'mid', outfit: 'coat', main: 0x1a2340, trim: 0xd9a441, beard: true, fez: true, clip: 'Idle_Talking_Loop' },
  { sex: 'm', lod: 'mid', outfit: 'villager', main: 0x8a2e1e, trim: 0xd9a441, beard: true, fez: true, clip: 'HandsHips' },
];
spec.forEach((s, i) => {
  const c = createCharacter(s);
  c.root.position.x = (i - 1.5) * 0.85;
  scene.add(c.root); c.play(s.clip); c.face(s.face || 'neutral'); chars.push(c);
});
const t1 = performance.now();
const baked = bakePose({ sex: 'f', skirt: 'long', clip: 'Cheer', time: 0.4 });
const im = new THREE.InstancedMesh(baked.geometry, baked.materials, 3);
for (let i = 0; i < 3; i++) { im.setMatrixAt(i, new THREE.Matrix4().makeRotationY(Math.PI).setPosition((i - 1) * 0.9, 0, -2.2)); im.setColorAt(i, new THREE.Color([0xc0392b, 0x2e86c1, 0x27ae60][i])); }
scene.add(im);
const bm = bakePose({ sex: 'm', outfit: 'villager', clip: 'Clap', time: 0.3, fez: true, beard: true });
const im2 = new THREE.InstancedMesh(bm.geometry, bm.materials, 2);
for (let i = 0; i < 2; i++) { im2.setMatrixAt(i, new THREE.Matrix4().makeRotationY(Math.PI).setPosition(1.8 + i * 0.9, 0, -2.2)); im2.setColorAt(i, new THREE.Color([0x8e44ad, 0xd35400][i])); }
scene.add(im2);
const tris = chars.map((c) => c.mesh.geometry.index.count / 3);
const log = [`parts ${parts} gen ${genMs}ms bake ${Math.round(performance.now() - t1)}ms`, `tris ${tris.join(' ')} crowd ${baked.geometry.index.count / 3} ${bm.geometry.index.count / 3}`];
document.getElementById('log').textContent = log.join('\n');
const tt = +(q.get('t') || 0.5);
for (const c of chars) c.update(tt);
for (let i = 0; i < 10; i++) for (const c of chars) c.update(0.016);
const view = q.get('view') || 'all';
if (view === 'face') { const x = chars[+(q.get('i') || 0)].root.position.x; const hy = chars[+(q.get('i') || 0)].bones.Head.getWorldPosition(new THREE.Vector3()).y; cam.position.set(x + 0.0, hy + 0.09, 0.62); cam.lookAt(x, hy + 0.075, 0); cam.fov = 22; }
else if (view === 'side') { cam.position.set(3.5, 1.3, 2.2); cam.lookAt(0, 0.95, 0); }
else if (view === 'back') { cam.position.set(0.3, 1.4, -5); cam.lookAt(0, 0.95, 0); }
else { cam.position.set(0, 1.25, 6.2); cam.lookAt(0, 0.95, 0); }
cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix();
renderer.render(scene, cam);
window.__ready = { log, info: renderer.info.render };
</script></body></html>
