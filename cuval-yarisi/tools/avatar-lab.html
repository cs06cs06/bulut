<!doctype html><html><head><meta charset="utf-8"><title>avatar lab</title>
<style>html,body{margin:0;height:100%;background:#223}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.js", "three/addons/": "../vendor/three/addons/" } }</script>
</head><body><script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(innerWidth, innerHeight); document.body.appendChild(renderer.domElement);
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.shadowMap.enabled = true;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x8fa3b0);
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 100);
scene.add(new THREE.HemisphereLight(0xdde8ff, 0x556644, 1.4));
const sun = new THREE.DirectionalLight(0xfff2dd, 2.6); sun.position.set(3, 6, 4); sun.castShadow = true; scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshStandardMaterial({ color: 0x6b8a3a })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const gl = new GLTFLoader(); gl.setMeshoptDecoder(MeshoptDecoder);
const load = (u) => gl.loadAsync(u);
const keys = (q.get('k') || 'f06,f10,bm01,bm04,m15,m17').split(',');
const anim = q.get('a') || 'idle';
const fez = (await load('../assets/avatars/fez.glb')).scene;
const info = [];
const mixers = [];
for (let i = 0; i < keys.length; i++) {
  const k = keys[i];
  const g = await load(`../assets/avatars/${k}.glb`);
  const root = g.scene; root.position.x = (i - (keys.length - 1) / 2) * 0.9;
  root.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.frustumCulled = false; } });
  scene.add(root);
  const sex = k.startsWith('f') ? 'f' : 'm';
  const a = await load(`../assets/avatars/anim/${sex}_${anim}.glb`);
  const mx = new THREE.AnimationMixer(root); mx.clipAction(a.animations[0]).play(); mixers.push(mx);
  mx.update(Number(q.get('t') || 1.2));
  root.updateMatrixWorld(true);
  const head = root.getObjectByName('Bip01_Head');
  if (sex === 'm' && head && q.get('fez') !== '0') { const f = fez.clone(); head.add(f); f.position.set(0.11, 0.0, 0); f.rotation.set(0, 0, -Math.PI / 2); }
  const box = new THREE.Box3().setFromObject(root);
  info.push(`${k}: h=${(box.max.y - box.min.y).toFixed(2)} min=${box.min.y.toFixed(2)} head=${head ? head.getWorldPosition(new THREE.Vector3()).toArray().map((v) => v.toFixed(2)) : '-'}`);
  if (q.get('axes')) { for (const bn of ['Bip01_Head', 'Bip01_Spine', 'Bip01_Pelvis', 'Bip01_L_UpperArm', 'Bip01_L_Thigh']) { const b = root.getObjectByName(bn); const wq = b.getWorldQuaternion(new THREE.Quaternion()); const ax = (v) => v.applyQuaternion(wq).toArray().map((x) => x.toFixed(2)).join(','); info.push(`${k} ${bn} pos ${b.getWorldPosition(new THREE.Vector3()).toArray().map((x) => x.toFixed(2))} X(${ax(new THREE.Vector3(1, 0, 0))}) Y(${ax(new THREE.Vector3(0, 1, 0))}) Z(${ax(new THREE.Vector3(0, 0, 1))})`); } }
  if (i === 0) { const names = []; root.traverse((o) => { if (o.isBone) names.push(o.name); }); info.push('bones: ' + names.slice(0, 30).join(' ')); const hd = head; info.push('head quat ' + hd.quaternion.toArray().map(v=>v.toFixed(2)) + ' world ' + hd.getWorldQuaternion(new THREE.Quaternion()).toArray().map(v=>v.toFixed(2))); }
}
if (q.get('lid')) { const [ax, d] = q.get('lid').split(':'); scene.traverse((o) => { if (/EyeBlinkTop/.test(o.name)) o.position[ax] += +d; if (/EyeBlinkBottom/.test(o.name)) o.position[ax] -= +d * 0.3; }); scene.updateMatrixWorld(true); }
if (q.get('blink')) { const [ax, ang] = q.get('blink').split(':'); scene.traverse((o) => { if (/EyeBlinkTop/.test(o.name)) { const v = new THREE.Vector3(); v[ax] = 1; o.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(v, +ang)); } if (/EyeBlinkBottom/.test(o.name)) { const v = new THREE.Vector3(); v[ax] = 1; o.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(v, -ang * 0.4)); } if (q.get('jaw') && o.name === 'Bip01_MJaw') { const v = new THREE.Vector3(); v[q.get('jaw').split(':')[0]] = 1; o.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(v, +q.get('jaw').split(':')[1])); } }); scene.updateMatrixWorld(true); }
const view = q.get('view') || 'front';
if (view === 'face') { const hx = scene.getObjectByName('Bip01_Head').getWorldPosition(new THREE.Vector3()); cam.position.set(hx.x, hx.y + 0.08, 0.9); cam.lookAt(hx.x, hx.y + 0.07, 0); cam.fov = 14; }
else if (view === 'side') { cam.position.set(6, 1.3, 0); cam.lookAt(0, 0.9, 0); }
else { cam.position.set(0, 1.25, 7.5); cam.lookAt(0, 0.9, 0); }
cam.updateProjectionMatrix();
renderer.render(scene, cam);
window.__ready = info;
</script></body></html>
