<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const q = new URLSearchParams(location.search);
const W = 1280, H = 800;
const r = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
r.setSize(W,H); r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace;

const s = new THREE.Scene();
const white = q.get('bg') === 'white';

if (!white) s.fog = new THREE.Fog(0x9aa3a6, 30, 90);

sun.position.set(-14, 22, -12); sun.castShadow = true;

sun.shadow.bias = -0.0005; s.add(sun);

const [px,py,pz,tx,ty,tz] = q.get('cam').split(',').map(Number);
cam.position.set(px,py,pz); cam.lookAt(tx,ty,tz);
new GLTFLoader().load('/out/normandy_house.glb', g => {

});
