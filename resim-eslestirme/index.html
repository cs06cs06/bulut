<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resim Eşleştirme</title>
<style>
  :root {
    --bg: #f4f1ea;
    --panel: #ffffff;
    --text: #2b2b2b;
    --muted: #6b6b6b;
    --accent: #3d7bd9;
    --card-back: #3d7bd9;
    --card-back-2: #5b93e6;
    --matched: #3fae6a;
    --shadow: 0 2px 8px rgba(0,0,0,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1d22;
      --panel: #262930;
      --text: #ececec;
      --muted: #a3a3a3;
      --accent: #6fa1ef;
      --card-back: #34568f;
      --card-back-2: #4368a8;
      --shadow: 0 2px 8px rgba(0,0,0,.5);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }
  h1 { margin: 8px 0 12px; font-size: 1.8rem; }
  .controls {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center;
    margin-bottom: 12px;
  }
  select, button {
    font: inherit; padding: 8px 14px; border-radius: 8px;
    border: 1px solid rgba(127,127,127,.35); background: var(--panel); color: var(--text);
    cursor: pointer;
  }
  button.primary { background: var(--accent); color: #fff; border-color: transparent; }
  .stats {
    display: flex; gap: 20px; margin-bottom: 16px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .stats b { color: var(--text); }
  .board {
    display: grid;
    gap: 10px;
    width: 100%;
    max-width: 640px;
    perspective: 1000px;
  }
  .card {
    position: relative;
    aspect-ratio: 1;
    cursor: pointer;
    border: none; padding: 0; background: none;
  }
  .card-inner {
    position: absolute; inset: 0;
    transition: transform .45s;
    transform-style: preserve-3d;
  }
  .card.flipped .card-inner, .card.matched .card-inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0;
    border-radius: 12px;
    backface-visibility: hidden;
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow);
  }
  .back {
    background: repeating-linear-gradient(45deg, var(--card-back), var(--card-back) 10px, var(--card-back-2) 10px, var(--card-back-2) 20px);
    color: rgba(255,255,255,.85);
    font-size: clamp(1.2rem, 5vw, 2rem);
    font-weight: 700;
  }
  .front {
    background: var(--panel);
    transform: rotateY(180deg);
    font-size: clamp(1.6rem, 8vw, 3.2rem);
  }
  .card.matched .front { outline: 3px solid var(--matched); animation: pop .4s; }
  .card.matched { cursor: default; }
  @keyframes pop { 50% { transform: rotateY(180deg) scale(1.08); } }
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: none; align-items: center; justify-content: center; padding: 16px;
  }
  .overlay.show { display: flex; }
  .dialog {
    background: var(--panel); color: var(--text); border-radius: 16px; padding: 24px 28px;
    text-align: center; max-width: 360px; width: 100%; box-shadow: var(--shadow);
  }
  .dialog h2 { margin-top: 0; }
  .best { color: var(--muted); font-size: .9rem; margin-top: 10px; }
</style>
</head>
<body>
  <h1>🧠 Resim Eşleştirme</h1>

  <div class="controls">
    <label for="difficulty">Zorluk:</label>
    <select id="difficulty">
      <option value="4x3">Kolay (4×3)</option>
      <option value="4x4" selected>Orta (4×4)</option>
      <option value="6x5">Zor (6×5)</option>
    </select>
    <select id="theme" aria-label="Tema">
      <option value="hayvanlar">🐶 Hayvanlar</option>
      <option value="meyveler">🍎 Meyveler</option>
      <option value="tasitlar">🚗 Taşıtlar</option>
      <option value="spor">⚽ Spor</option>
    </select>
    <button class="primary" id="restart">Yeni Oyun</button>
  </div>

  <div class="stats">
    <span>Hamle: <b id="moves">0</b></span>
    <span>Süre: <b id="time">00:00</b></span>
    <span>Eşleşme: <b id="pairs">0/0</b></span>
  </div>

  <div class="board" id="board"></div>

  <div class="overlay" id="overlay">
    <div class="dialog">
      <h2>🎉 Tebrikler!</h2>
      <p id="result"></p>
      <p class="best" id="best"></p>
      <button class="primary" id="again">Tekrar Oyna</button>
    </div>
  </div>

<script>
const THEMES = {
  hayvanlar: ["🐶","🐱","🐭","🐹","🐰","🦊","🐻","🐼","🐨","🐯","🦁","🐮","🐷","🐸","🐵"],
  meyveler:  ["🍎","🍐","🍊","🍋","🍌","🍉","🍇","🍓","🫐","🍒","🍑","🥭","🍍","🥥","🥝"],
  tasitlar:  ["🚗","🚕","🚙","🚌","🚎","🏎️","🚓","🚑","🚒","🚚","🚜","🚲","🛵","✈️","🚀"],
  spor:      ["⚽","🏀","🏈","⚾","🎾","🏐","🏉","🎱","🏓","🏸","🏒","🥊","⛳","🏹","🎳"]
};

const boardEl = document.getElementById("board");
const movesEl = document.getElementById("moves");
const timeEl = document.getElementById("time");
const pairsEl = document.getElementById("pairs");
const overlay = document.getElementById("overlay");
const difficultyEl = document.getElementById("difficulty");
const themeEl = document.getElementById("theme");

let first = null, second = null, lock = false;
let moves = 0, matched = 0, totalPairs = 0;
let seconds = 0, timer = null;

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function formatTime(s) {
  return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
}

function startTimer() {
  if (timer) return;
  timer = setInterval(() => { seconds++; timeEl.textContent = formatTime(seconds); }, 1000);
}

function stopTimer() { clearInterval(timer); timer = null; }

function updateStats() {
  movesEl.textContent = moves;
  pairsEl.textContent = matched + "/" + totalPairs;
}

function newGame() {
  stopTimer();
  first = second = null; lock = false;
  moves = 0; matched = 0; seconds = 0;
  timeEl.textContent = "00:00";
  overlay.classList.remove("show");

  const [cols, rows] = difficultyEl.value.split("x").map(Number);
  totalPairs = (cols * rows) / 2;
  const images = shuffle([...THEMES[themeEl.value]]).slice(0, totalPairs);
  const deck = shuffle([...images, ...images]);

  boardEl.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  boardEl.innerHTML = "";
  deck.forEach(img => {
    const card = document.createElement("button");
    card.className = "card";
    card.dataset.img = img;
    card.setAttribute("aria-label", "Kapalı kart");
    card.innerHTML = `<div class="card-inner"><div class="face back">?</div><div class="face front">${img}</div></div>`;
    card.addEventListener("click", () => flip(card));
    boardEl.appendChild(card);
  });
  updateStats();
}

function flip(card) {
  if (lock || card === first || card.classList.contains("matched")) return;
  startTimer();
  card.classList.add("flipped");
  card.setAttribute("aria-label", card.dataset.img);

  if (!first) { first = card; return; }
  second = card;
  moves++;

  if (first.dataset.img === second.dataset.img) {
    first.classList.add("matched");
    second.classList.add("matched");
    matched++;
    first = second = null;
    updateStats();
    if (matched === totalPairs) finish();
  } else {
    lock = true;
    updateStats();
    setTimeout(() => {
      [first, second].forEach(c => {
        c.classList.remove("flipped");
        c.setAttribute("aria-label", "Kapalı kart");
      });
      first = second = null;
      lock = false;
    }, 900);
  }
}

function finish() {
  stopTimer();
  const key = "resim-eslestirme-rekor-" + difficultyEl.value;
  let best = null;
  try { best = JSON.parse(localStorage.getItem(key)); } catch (e) {}
  let msg = "";
  if (!best || moves < best.moves || (moves === best.moves && seconds < best.seconds)) {
    best = { moves, seconds };
    try { localStorage.setItem(key, JSON.stringify(best)); } catch (e) {}
    msg = "🏆 Yeni rekor!";
  } else {
    msg = `Rekor: ${best.moves} hamle, ${formatTime(best.seconds)}`;
  }
  document.getElementById("result").textContent =
    `${totalPairs} çifti ${moves} hamlede, ${formatTime(seconds)} sürede buldun.`;
  document.getElementById("best").textContent = msg;
  setTimeout(() => overlay.classList.add("show"), 500);
}

document.getElementById("restart").addEventListener("click", newGame);
document.getElementById("again").addEventListener("click", newGame);
difficultyEl.addEventListener("change", newGame);
themeEl.addEventListener("change", newGame);

newGame();
</script>
</body>
</html>
