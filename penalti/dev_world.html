<!doctype html>
<html><head><meta charset="utf-8"><title>dev world</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<link rel="stylesheet" href="css/fonts.css">
<script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.min.js","three/addons/":"./vendor/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { World } from './js/world.js';
import { PostFX } from './js/fx.js';
import { loadBallMesh } from './js/ball.js';

const q = new URLSearchParams(location.search);
const quality = q.get('quality') || 'medium';
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: true });
const scale = +(q.get('scale') || 1);
renderer.setPixelRatio(scale);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);
window.addEventListener('error', e => console.log('ERR', e.message));
await document.fonts.load('800 100px "Barlow Condensed"');
const world = new World(renderer, quality);
const t0 = performance.now();
await world.load();
console.log('world loaded ms', (performance.now() - t0).toFixed(0), 'crowd', world.stadium.crowdN);
const ball = await loadBallMesh(); ball.position.set(0, 0.111, 11); world.scene.add(ball);
const fx = new PostFX(renderer, quality);
if (q.get('msaa') !== null) { fx.q = { ...fx.q, msaa: +q.get('msaa') }; }
if (q.get('dofoff')) fx.params.dofOn = 0;
if (q.get('dbg')) fx.debugDepth = true;
fx.setSize(innerWidth * scale, innerHeight * scale);
fx.params.focus = +(q.get('focus') || 5.2); fx.params.aperture = +(q.get('ap') || 26);
fx.params.exposure = +(q.get('exp') || 1); fx.params.bloomThreshold = +(q.get('bt') || 1.8);
const cam = new THREE.PerspectiveCamera(+(q.get('fov') || 38), innerWidth / innerHeight, 0.1, 400);
const view = q.get('view') || 'aim';
const P = {
  aim: [[0.6, 1.7, 15.6], [0, 1.15, 5]],
  wide: [[22, 9, 30], [0, 1, 5]],
  net: [[0, 1.4, -5.5], [0, 1.2, 12]],
  side: [[16, 1.4, 2], [0, 1.2, 1]],
  high: [[0, 22, 40], [0, 0, 8]],
  crowd: [[0, 3, 12], [0, 8, -28]],
}[view];
cam.position.set(...P[0]); cam.lookAt(...P[1]);
world.update(1 / 60, 1);
for (let i = 0; i < 3; i++) fx.render(world.scene, cam, 1 / 60);
window.__ready = true;
</script></body></html>
