<!doctype html>
<html><head><meta charset="utf-8"><title>dev anim</title>
<style>html,body{margin:0;background:#222;overflow:hidden}canvas{display:block}</style>
<link rel="stylesheet" href="css/fonts.css">
<script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.min.js","three/addons/":"./vendor/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { loadCharacterBase, createCharacter } from './js/character.js';
import { Rig, Retargeter } from './js/anim.js';

const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a2030);
scene.add(new THREE.HemisphereLight(0xbfd6ff, 0x203020, 0.7));
const dl = new THREE.DirectionalLight(0xffffff, 2.6); dl.position.set(2, 4, 3); dl.castShadow = true; scene.add(dl);
const rim = new THREE.DirectionalLight(0x99bbff, 1.5); rim.position.set(-3, 3, -3); scene.add(rim);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.MeshStandardMaterial({ color: 0x2c5a2c, roughness: 0.9 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
await document.fonts.load('800 100px "Barlow Condensed"');
const B = await loadCharacterBase();
const specs = (q.get('anims') || 'idle:0.5,run:0.2,walk:0.3,samba:3').split(',');
const chars = [];
specs.forEach((s, i) => {
  const [name, t] = s.split(':');
  const c = createCharacter(i % 2 ? 'away' : 'home', { beard: i % 2 === 0 });
  c.position.x = (i - (specs.length - 1) / 2) * 1.2;
  scene.add(c);
  const rig = new Rig(c.children[0]);
  const isSamba = name === 'samba';
  const rt = new Retargeter(isSamba ? B.michelle.scene : B.xbot.scene, isSamba ? B.michelle.animations : B.xbot.animations, rig);
  rt.play(isSamba ? 'SambaDance' : name, { fade: 0 });
  for (let k = 0; k < Math.round(+t * 60); k++) rt.update(1 / 60);
  rt.update(0);
  rig.commit();
  chars.push(c);
});
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 50);
const view = q.get('view') || 'front';
const d = 5 + specs.length * 0.5;
const pos = { front: [0, 1.1, d], side: [d, 1.1, 0], three: [d * .6, 1.4, d * .8], back: [0, 1.1, -d] }[view];
cam.position.set(...pos); cam.lookAt(0, 0.95, 0);
scene.updateMatrixWorld(true);
renderer.render(scene, cam);
window.__ready = true;
</script></body></html>
