<!doctype html>
<html><head><meta charset="utf-8"><title>dev body</title>
<style>html,body{margin:0;background:#222;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.min.js","three/addons/":"./vendor/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { buildBodyGeometry } from './js/sdfbody.js';

const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x30343c);
scene.add(new THREE.HemisphereLight(0xffffff, 0x555555, 1.0));
const dl = new THREE.DirectionalLight(0xffffff, 3); dl.position.set(2, 4, 3); scene.add(dl);
scene.add(new THREE.GridHelper(4, 8));

const gl = await new GLTFLoader().loadAsync('./assets/models/player_rpm.glb');
const root = gl.scene; scene.add(root);
root.updateMatrixWorld(true);
const J = {}, bones = {};
root.traverse(o => { if (o.isBone) { const p = new THREE.Vector3(); o.getWorldPosition(p); J[o.name] = p.toArray(); bones[o.name] = o; } });
let head;
root.traverse(o => { if (o.isSkinnedMesh) { if (o.name === 'Wolf3D_Head') head = o; if (['Wolf3D_Outfit_Top','Wolf3D_Headwear','Wolf3D_Outfit_Bottom','Wolf3D_Outfit_Footwear'].includes(o.name)) o.visible = false; } });
const skel = head.skeleton;
root.traverse(o => { if (o.name === 'Wolf3D_Body') {
  const g = o.geometry, pa = g.attributes.position, ix = g.index.array, out = [];
  for (let i = 0; i < ix.length; i += 3) { const cx = (pa.getX(ix[i]) + pa.getX(ix[i+1]) + pa.getX(ix[i+2])) / 3; if (Math.abs(cx) > 0.40) out.push(ix[i], ix[i+1], ix[i+2]); }
  g.setIndex(out);
}});
const t0 = performance.now();
const geo = buildBodyGeometry(J, name => skel.bones.findIndex(b => b.name === name), { h: +(q.get('h') || 0.0125) });
console.log('body build ms', (performance.now() - t0).toFixed(0), 'verts', geo.attributes.position.count, 'tris', geo.index.count / 3);
const mat = new THREE.MeshStandardMaterial({ color: 0xd9a78a, roughness: 0.6, metalness: 0 });
const body = new THREE.SkinnedMesh(geo, mat);
body.frustumCulled = false;
head.parent.add(body);
body.bind(skel, head.bindMatrix);

const pose = q.get('pose') || 'rest';
const rotate = (name, axis, deg) => { const b = bones[name]; b.rotateOnWorldAxis?.(new THREE.Vector3(...axis), deg * Math.PI / 180); };
if (pose === 'bend') {
  // world-axis rotations for quick sanity check
  const setW = (name, axis, deg) => {
    const b = bones[name];
    const parentQ = new THREE.Quaternion(); b.parent.getWorldQuaternion(parentQ);
    const q0 = new THREE.Quaternion(); b.getWorldQuaternion(q0);
    const d = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(...axis), deg * Math.PI / 180);
    q0.premultiply(d);
    b.quaternion.copy(parentQ.invert().multiply(q0));
    b.updateMatrixWorld(true);
  };
  setW('RightUpLeg', [1, 0, 0], -70);
  setW('RightLeg', [1, 0, 0], 60);
  setW('LeftUpLeg', [1, 0, 0], 25);
  setW('LeftArm', [0, 0, 1], 50);
  setW('LeftForeArm', [1, 0, 0], -80);
  setW('RightArm', [0, 0, 1], -70);
  setW('Spine1', [1, 0, 0], 20);
  setW('Head', [0, 1, 0], 30);
}
root.updateMatrixWorld(true);

const box = new THREE.Box3().setFromObject(head.parent);
const H = 1.9, cy = 0.95;
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 50);
const view = q.get('view') || 'three';
const d = H * 2.4;
const pos = { front: [0, cy, d], back: [0, cy, -d], side: [d, cy, 0], three: [d*.7, cy+H*.1, d*.7], close: [0.6, 1.5, 1.3] }[view];
cam.position.set(...pos); cam.lookAt(0, view==='close'?1.3:cy, 0);
renderer.render(scene, cam);
window.__ready = true;
</script></body></html>
