<!doctype html>
<html><head><meta charset="utf-8"><title>dev viewer</title>
<style>html,body{margin:0;background:#222;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.min.js","three/addons/":"./vendor/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x30343c);
scene.add(new THREE.HemisphereLight(0xffffff, 0x555555, 1.2));
const dl = new THREE.DirectionalLight(0xffffff, 3); dl.position.set(2, 4, 3); scene.add(dl);
const grid = new THREE.GridHelper(4, 8); scene.add(grid);

const gl = await new GLTFLoader().loadAsync('./assets/models/' + (q.get('model') || 'player_rpm.glb'));
const root = gl.scene; scene.add(root);
const hide=(q.get('hide')||'').split(',');
root.traverse(o=>{ if(hide.includes(o.name)) o.visible=false; });
root.updateMatrixWorld(true);

const info = { meshes: [], bones: {} };
root.traverse(o => {
  if (o.isSkinnedMesh || o.isMesh) {
    o.geometry.computeBoundingBox();
    const bb = o.geometry.boundingBox;
    info.meshes.push({ name: o.name, skinned: !!o.isSkinnedMesh, mat: o.material.name, bb: [bb.min.toArray().map(v=>+v.toFixed(3)), bb.max.toArray().map(v=>+v.toFixed(3))], attrs: Object.keys(o.geometry.attributes), verts: o.geometry.attributes.position.count, scale: o.scale.toArray() });
  }
  if (o.isBone) {
    const p = new THREE.Vector3(); o.getWorldPosition(p);
    info.bones[o.name] = p.toArray().map(v => +v.toFixed(3));
  }
});
console.log('INFO ' + JSON.stringify(info));
console.log('ANIMS ' + JSON.stringify(gl.animations.map(a => [a.name, a.duration, a.tracks.length])));
const box = new THREE.Box3().setFromObject(root);
console.log('BOX ' + JSON.stringify([box.min.toArray(), box.max.toArray()]));

const view = q.get('view') || 'front';
const H = box.max.y - box.min.y, cy = (box.max.y + box.min.y) / 2;
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 50);
const d = H * 2.6;
const pos = { front: [0, cy, d], back: [0, cy, -d], side: [d, cy, 0], three: [d*.7, cy+H*.1, d*.7] }[view];
cam.position.set(...pos); cam.lookAt(0, cy, 0);
renderer.render(scene, cam);
window.__ready = true;
</script></body></html>
