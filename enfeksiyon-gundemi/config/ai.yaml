# Yapay zekâ ayarları
# ----------------------------------------------------------------------------
# Model adları Anthropic dokümantasyonundan doğrulanmıştır (Ekim 2026).
# Fiyatlar 1 milyon token başına ABD dolarıdır; toplu işlemede (Batch API) %50 indirim uygulanır.
# ----------------------------------------------------------------------------

triage:
  model: claude-haiku-5-5
  effort: low               # düşük: hızlı ve ucuz sınıflandırma
  max_tokens: 2000
  max_per_run: 4000         # bir çalıştırmada triyaja gönderilecek en fazla kayıt (veritabanı yazma kotası)

review:
  model: claude-opus-5-5
  effort: medium            # low | medium | high — yükseldikçe daha derin ama daha pahalı
  max_tokens: 16000
  max_per_day: 8            # günlük en fazla tam editör yazısı
  initial_backlog: 20       # ilk kurulumda geriye dönük tarama için bir kerelik yazı sayısı
  min_importance: 4         # bu önem puanının (1–5) altındakiler tam yazı almaz
  candidate_days: 7         # seçilmeyen önemli yayınlar kaç gün aday kalır
  related_reviews: 5        # bağlam için verilecek en fazla geçmiş yazı
  fulltext_max_chars: 40000 # açık erişimli tam metin varsa modele verilecek en fazla karakter (~10.000 token)

budget:
  monthly_usd: 25           # aşılırsa yeni yapay zekâ işi başlatılmaz, panoda uyarı çıkar

batch:
  max_wait_minutes: 40      # toplu işin bitmesi için bir çalıştırmada beklenecek süre

# 1M token başına fiyatlar (standart). Kaynak: Anthropic fiyat tablosu.
prices:
  claude-haiku-5-5:  { input: 0.10, output: 0.50, cache_write: 0.125, cache_read: 0.01 }
  claude-opus-5-5:   { input: 4.00, output: 20.00, cache_write: 5.00, cache_read: 0.20 }
  claude-sonnet-5-5: { input: 2.00, output: 10.00, cache_write: 2.50, cache_read: 0.20 }
  claude-opus-5:     { input: 5.00, output: 25.00, cache_write: 6.25, cache_read: 0.50 }
  claude-opus-4-8:   { input: 5.00, output: 25.00, cache_write: 6.25, cache_read: 0.50 }

# Soru-cevap (uygulamadaki "Sor" sekmesi ve makale sayfasındaki "Soru sor" düğmesi)
qa:
  model: claude-opus-5-5     # yanıtları yazan model
  effort: medium
  max_tokens: 16000
  plan_model: claude-haiku-5-5  # soruyu arama terimlerine çeviren ucuz model
  max_sources: 12            # genel sorularda yanıta temel alınacak en fazla yayın
  max_turns: 10              # bir sohbette en fazla soru sayısı (sonra yeni sohbet)
