<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bulut GP — 3D Araba Yarışı</title>
<style>
  :root { --accent:#ffb020; --accent2:#ff3b3b; --glass:rgba(10,14,24,.62); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:#0b0e16; color:#fff;
    font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif; user-select:none; -webkit-user-select:none; touch-action:none; }
  canvas#game { position:fixed; inset:0; width:100%; height:100%; display:block; }

  .hud { position:fixed; pointer-events:none; z-index:5; opacity:0; transition:opacity .5s; }
  body.racing .hud { opacity:1; }
  .panel { background:var(--glass); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.12); border-radius:14px; padding:10px 16px; }
  .label { font-size:11px; letter-spacing:.18em; opacity:.65; font-weight:600; }
  .big { font-size:30px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.1; }
  .big small { font-size:16px; opacity:.6; font-weight:600; }

  #topLeft { top:16px; left:16px; display:flex; gap:10px; }
  #topRight { top:16px; right:16px; text-align:right; }
  #topRight .row { font-variant-numeric:tabular-nums; font-size:15px; margin-top:2px; opacity:.85; }
  #topRight .row b { color:var(--accent); }
  #mapWrap { left:16px; bottom:16px; padding:6px; }
  #mapWrap canvas { display:block; width:170px; height:170px; }
  #speedo { right:16px; bottom:16px; width:230px; height:230px; }
  #speedo canvas { width:100%; height:100%; display:block; }
  #nitroWrap { right:260px; bottom:28px; width:180px; }
  #nitroBar { height:10px; border-radius:6px; background:rgba(255,255,255,.14); overflow:hidden; margin-top:6px; }
  #nitroFill { height:100%; width:100%; background:linear-gradient(90deg,#1ec8ff,#7af0ff); box-shadow:0 0 12px #3cd7ff; transform-origin:left; }

  #center { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; z-index:6; }
  #countdown { font-size:min(28vw,220px); font-weight:900; font-style:italic; text-shadow:0 8px 40px rgba(0,0,0,.6); opacity:0; }
  #countdown.pop { animation:pop .9s ease-out forwards; }
  @keyframes pop { 0%{opacity:0; transform:scale(2.2)} 18%{opacity:1; transform:scale(1)} 75%{opacity:1} 100%{opacity:0; transform:scale(.7)} }
  #banner { position:fixed; top:22%; left:50%; transform:translateX(-50%); z-index:6; pointer-events:none;
    font-weight:900; font-style:italic; font-size:34px; letter-spacing:.06em; padding:8px 26px; border-radius:10px;
    background:rgba(255,40,40,.85); opacity:0; transition:opacity .2s; }
  #banner.show { opacity:1; animation:blink .6s infinite; }
  #banner.info { background:rgba(255,176,32,.92); color:#111; animation:none; }
  @keyframes blink { 50% { opacity:.35; } }

  #speedFx { position:fixed; inset:0; pointer-events:none; z-index:4; opacity:0;
    background:radial-gradient(ellipse at center, transparent 45%, rgba(120,220,255,.16) 75%, rgba(40,160,255,.4) 100%); }
  #vignette { position:fixed; inset:0; pointer-events:none; z-index:3;
    background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.42) 100%); }

  .overlay { position:fixed; inset:0; z-index:10; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(180deg, rgba(6,8,14,.35), rgba(6,8,14,.78)); transition:opacity .6s; }
  .overlay.hidden { opacity:0; pointer-events:none; }
  .card { text-align:center; padding:34px 44px; max-width:92vw; max-height:100vh; overflow-y:auto; }
  h1 { margin:0; font-size:min(15vw,96px); font-weight:900; font-style:italic; letter-spacing:-.02em; line-height:.95;
    background:linear-gradient(180deg,#fff 20%,#ffcf6b 60%,#ff7a18); -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 6px 24px rgba(255,120,20,.45)); }
  .sub { letter-spacing:.42em; font-size:13px; opacity:.8; margin:10px 0 26px; font-weight:600; }
  .keys { display:grid; grid-template-columns:auto auto; gap:6px 18px; justify-content:center; font-size:14px; opacity:.9; margin-bottom:26px; text-align:left; }
  .keys kbd { display:inline-block; min-width:26px; text-align:center; padding:2px 7px; border-radius:6px; background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.25); font-family:inherit; font-size:12px; font-weight:700; margin-right:3px; }
  button.go { pointer-events:auto; cursor:pointer; border:0; border-radius:999px; padding:16px 54px; font-size:20px; font-weight:900; letter-spacing:.14em;
    color:#161006; background:linear-gradient(180deg,#ffd76a,#ff9a1f); box-shadow:0 10px 40px rgba(255,150,30,.5), inset 0 2px 0 rgba(255,255,255,.6);
    transition:transform .15s; font-family:inherit; }
  button.go:hover { transform:scale(1.06); }
  #loading { font-size:14px; opacity:.7; margin-top:16px; min-height:18px; }
  #results { margin:18px auto 24px; border-collapse:collapse; font-size:16px; font-variant-numeric:tabular-nums; }
  #results td { padding:5px 16px; text-align:left; }
  #results tr.me td { color:var(--accent); font-weight:800; }
  #finishTitle { font-size:min(12vw,72px); }

  #touch { display:none; position:fixed; inset:0; z-index:7; pointer-events:none; }
  body.touch.racing #touch { display:block; }
  .tbtn { position:absolute; pointer-events:auto; width:74px; height:74px; border-radius:50%; background:rgba(255,255,255,.14);
    border:2px solid rgba(255,255,255,.35); display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:800; }
  .tbtn.on { background:rgba(255,176,32,.55); }
  #tL { left:18px; bottom:200px; } #tR { left:108px; bottom:200px; }
  #tGas { right:18px; bottom:260px; } #tBrk { right:108px; bottom:260px; } #tNos { right:18px; bottom:350px; font-size:15px; }
  @media (max-width:760px) {
    #speedo { width:150px; height:150px; } #nitroWrap { right:16px; bottom:176px; width:150px; }
    #mapWrap canvas { width:110px; height:110px; } .big { font-size:22px; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="vignette"></div>
<div id="speedFx"></div>

<div id="topLeft" class="hud">
  <div class="panel"><div class="label">TUR</div><div class="big"><span id="lap">1</span><small>/3</small></div></div>
  <div class="panel"><div class="label">SIRA</div><div class="big"><span id="pos">6</span><small>/6</small></div></div>
</div>
<div id="topRight" class="hud panel">
  <div class="label">SÜRE</div><div class="big" id="time">0:00.00</div>
  <div class="row">Tur: <span id="lapTime">0:00.00</span></div>
  <div class="row">En iyi: <b id="bestLap">—</b></div>
</div>
<div id="mapWrap" class="hud panel"><canvas id="map" width="340" height="340"></canvas></div>
<div id="nitroWrap" class="hud panel"><div class="label">NİTRO</div><div id="nitroBar"><div id="nitroFill"></div></div></div>
<div id="speedo" class="hud"><canvas id="gauge" width="460" height="460"></canvas></div>

<div id="center"><div id="countdown"></div></div>
<div id="banner"></div>

<div id="touch">
  <div class="tbtn" id="tL">◀</div><div class="tbtn" id="tR">▶</div>
  <div class="tbtn" id="tGas">▲</div><div class="tbtn" id="tBrk">▼</div><div class="tbtn" id="tNos">NOS</div>
</div>

<div id="menu" class="overlay">
  <div class="card">
    <h1>BULUT GP</h1>
    <div class="sub">GÜN BATIMI PİSTİ · 3 TUR · 5 RAKİP</div>
    <div class="keys">
      <div><kbd>W</kbd><kbd>↑</kbd> Gaz</div><div><kbd>S</kbd><kbd>↓</kbd> Fren / Geri</div>
      <div><kbd>A</kbd><kbd>D</kbd><kbd>←</kbd><kbd>→</kbd> Direksiyon</div><div><kbd>Boşluk</kbd> El freni (drift)</div>
      <div><kbd>Shift</kbd> Nitro</div><div><kbd>C</kbd> Kamera · <kbd>R</kbd> Piste dön · <kbd>M</kbd> Ses</div>
    </div>
    <button class="go" id="startBtn" disabled>YÜKLENİYOR…</button>
    <div id="loading"></div>
  </div>
</div>

<div id="finish" class="overlay hidden">
  <div class="card">
    <h1 id="finishTitle">YARIŞ BİTTİ</h1>
    <div class="sub" id="finishSub"></div>
    <table id="results"></table>
    <button class="go" id="againBtn">TEKRAR OYNA</button>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { Sky } from 'three/addons/objects/Sky.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ───────────────────────── Yardımcılar ───────────────────────── */
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
let seed = 1337;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const fmt = t => { const m = Math.floor(t / 60), s = t - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(2); };

/* ───────────────────────── Renderer / Sahne ───────────────────────── */
const canvas = $('game');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.6;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xd8a57c, 0.0008);
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.4, 5000);

// Gökyüzü + güneş
const sky = new Sky();
sky.scale.setScalar(5000);
scene.add(sky);
const sunDir = new THREE.Vector3().setFromSphericalCoords(1, THREE.MathUtils.degToRad(90 - 11), THREE.MathUtils.degToRad(-125));
Object.assign(sky.material.uniforms.turbidity, { value: 7 });
Object.assign(sky.material.uniforms.rayleigh, { value: 2.4 });
Object.assign(sky.material.uniforms.mieCoefficient, { value: 0.006 });
Object.assign(sky.material.uniforms.mieDirectionalG, { value: 0.86 });
sky.material.uniforms.sunPosition.value.copy(sunDir);

// Ortam yansıması (gökyüzünden)
{
  const pm = new THREE.PMREMGenerator(renderer);
  const envScene = new THREE.Scene();
  const sky2 = new Sky(); sky2.scale.setScalar(5000);
  sky2.material.uniforms.turbidity.value = 7; sky2.material.uniforms.rayleigh.value = 2.4;
  sky2.material.uniforms.mieCoefficient.value = 0.006; sky2.material.uniforms.mieDirectionalG.value = 0.86;
  sky2.material.uniforms.sunPosition.value.copy(sunDir);
  envScene.add(sky2);
  scene.environment = pm.fromScene(envScene, 0.02).texture;
  pm.dispose();
}

const hemi = new THREE.HemisphereLight(0xffd9b0, 0x4a5a3a, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffc890, 3.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -75, right: 75, top: 75, bottom: -75, near: 10, far: 420 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.04;
scene.add(sun, sun.target);

// Post-processing
const rt = new THREE.WebGLRenderTarget(innerWidth, innerHeight, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.3, 0.55, 1.7);
composer.addPass(bloom);
composer.addPass(new OutputPass());

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

/* ───────────────────────── Doku üreticileri ───────────────────────── */
function canvasTex(w, h, draw, repeat = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
function noise(g, w, h, n, colors, minS = 1, maxS = 3) {
  for (let i = 0; i < n; i++) {
    g.fillStyle = colors[(Math.random() * colors.length) | 0];
    const s = minS + Math.random() * (maxS - minS);
    g.fillRect(Math.random() * w, Math.random() * h, s, s);
  }
}
const roadTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#4a4d55'; g.fillRect(0, 0, w, h);
  noise(g, w, h, 26000, ['#565962', '#40434a', '#5e616b', '#383a40'], 1, 3);
  // lastik izleri (yarış çizgisi)
  const gr = g.createLinearGradient(0, 0, w, 0);
  gr.addColorStop(0.2, 'rgba(0,0,0,0)'); gr.addColorStop(0.5, 'rgba(0,0,0,.28)'); gr.addColorStop(0.8, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.fillStyle = '#e9e9e4'; g.fillRect(14, 0, 10, h); g.fillRect(w - 24, 0, 10, h);
  g.fillStyle = 'rgba(240,240,230,.85)'; g.fillRect(w / 2 - 4, 0, 8, h * 0.45);
});
const curbTex = canvasTex(64, 64, (g, w, h) => {
  g.fillStyle = '#e8e8e8'; g.fillRect(0, 0, w, h); g.fillStyle = '#d6202a'; g.fillRect(0, 0, w, h / 2);
});
const grassTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#52772f'; g.fillRect(0, 0, w, h);
  noise(g, w, h, 30000, ['#5d8436', '#476b29', '#688f3d', '#3f6126', '#74964a'], 1, 4);
});
grassTex.repeat.set(260, 260);
const wallTex = canvasTex(1024, 64, (g, w, h) => {
  const cols = ['#f2f2f2', '#d6202a', '#f2f2f2', '#1f4fd6'];
  for (let i = 0; i < 4; i++) { g.fillStyle = cols[i]; g.fillRect(i * 256, 0, 256, h); }
  g.font = '900 italic 40px Arial'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = '#fff'; g.fillText('BULUT GP', 384, 34); g.fillText('TURBO', 896, 34);
  g.fillStyle = '#111'; g.fillText('NİTRO+', 128, 34); g.fillText('HIZ', 640, 34);
  g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(0, h - 6, w, 6);
});
const checkerTex = canvasTex(256, 64, (g, w, h) => {
  for (let y = 0; y < 4; y++) for (let x = 0; x < 16; x++) { g.fillStyle = (x + y) % 2 ? '#111' : '#fff'; g.fillRect(x * 16, y * 16, 16, 16); }
});
const crowdTex = canvasTex(512, 128, (g, w, h) => {
  g.fillStyle = '#39404d'; g.fillRect(0, 0, w, h);
  const cols = ['#ff5252', '#ffd740', '#40c4ff', '#fff', '#69f0ae', '#ff8a65', '#b388ff', '#f5f5f5', '#263238'];
  for (let y = 6; y < h; y += 12) for (let x = 4 + (y % 24 ? 5 : 0); x < w; x += 10) {
    g.fillStyle = cols[(Math.random() * cols.length) | 0]; g.fillRect(x, y, 6, 7);
    g.fillStyle = '#e8b89a'; g.fillRect(x + 1, y - 4, 4, 4);
  }
});
function softDot(inner, outer) {
  return canvasTex(64, 64, (g) => {
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, inner); gr.addColorStop(1, outer);
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  }, false);
}
const smokeTex = softDot('rgba(255,255,255,.75)', 'rgba(255,255,255,0)');

/* ───────────────────────── Pist ───────────────────────── */
const ROAD_W = 9, CURB_W = 1.3, WALL_D = ROAD_W + 7.5, LAPS = 3;
const ctrl = [[35, -137], [110, -130], [200, -70], [190, 30], [110, 70], [30, 30], [-30, 80], [0, 160], [-90, 200], [-190, 150], [-220, 20], [-180, -110], [-40, -140]]
  .map(p => new THREE.Vector3(p[0], 0, p[1]));
const curve = new THREE.CatmullRomCurve3(ctrl, true, 'centripetal');
const N = 900;
const TRACK_LEN = curve.getLength();
const DS = TRACK_LEN / N;
const P = [], T = [], NR = [], K = []; // nokta, teğet, sol normal, işaretli eğrilik
{
  const sp = curve.getSpacedPoints(N);
  for (let i = 0; i < N; i++) P.push(sp[i]);
  for (let i = 0; i < N; i++) {
    const t = P[(i + 1) % N].clone().sub(P[(i + N - 1) % N]).normalize();
    T.push(t); NR.push(new THREE.Vector3(t.z, 0, -t.x)); // sol taraf
  }
  for (let i = 0; i < N; i++) {
    const d = T[(i + 1) % N].clone().sub(T[i]);
    K.push(d.dot(NR[i]) / DS);
  }
  // eğriliği yumuşat
  for (let pass = 0; pass < 3; pass++) {
    const c = K.slice();
    for (let i = 0; i < N; i++) K[i] = (c[(i + N - 1) % N] + c[i] * 2 + c[(i + 1) % N]) / 4;
  }
}
const _sa = { pos: new THREE.Vector3(), tan: new THREE.Vector3(), nor: new THREE.Vector3() };
function sampleTrack(dist, out = _sa) {
  let f = ((dist / DS) % N + N) % N;
  const i = Math.floor(f), j = (i + 1) % N, t = f - i;
  out.pos.lerpVectors(P[i], P[j], t);
  out.tan.lerpVectors(T[i], T[j], t).normalize();
  out.nor.set(out.tan.z, 0, -out.tan.x);
  return out;
}
function ribbon(offA, offB, yA, yB, vRep, uA = 0, uB = 1, alongU = false) {
  const pos = [], uv = [], idx = [];
  for (let i = 0; i <= N; i++) {
    const k = i % N, p = P[k], n = NR[k], v = (i / N) * vRep;
    pos.push(p.x + n.x * offA, yA, p.z + n.z * offA, p.x + n.x * offB, yB, p.z + n.z * offB);
    if (alongU) uv.push(v, 0, v, 1); else uv.push(uA, v, uB, v);
    if (i < N) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}
{
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(5200, 5200, 96, 96),
    new THREE.MeshStandardMaterial({ map: grassTex, roughness: 1, envMapIntensity: 0.25, polygonOffset: true, polygonOffsetFactor: 2, polygonOffsetUnits: 8 }));
  ground.rotation.x = -Math.PI / 2; ground.position.y = -0.06; ground.receiveShadow = true; scene.add(ground);

  const road = new THREE.Mesh(ribbon(ROAD_W, -ROAD_W, 0.04, 0.04, Math.round(TRACK_LEN / 14)),
    new THREE.MeshStandardMaterial({ map: roadTex, roughness: 0.82, metalness: 0.05, envMapIntensity: 0.55, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -8 }));
  road.receiveShadow = true; scene.add(road);

  const curbMat = new THREE.MeshStandardMaterial({ map: curbTex, roughness: 0.7, polygonOffset: true, polygonOffsetFactor: -3, polygonOffsetUnits: -12 });
  const vr = Math.round(TRACK_LEN / 5);
  for (const s of [1, -1]) {
    const a = s > 0 ? ROAD_W + CURB_W : -ROAD_W, b = s > 0 ? ROAD_W : -ROAD_W - CURB_W;
    const c = new THREE.Mesh(ribbon(a, b, s > 0 ? -0.08 : 0.1, s > 0 ? 0.1 : -0.08, vr), curbMat);
    c.receiveShadow = true; scene.add(c);
  }
  const wallMat = new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.6, side: THREE.DoubleSide });
  const ur = Math.round(TRACK_LEN / 40);
  for (const s of [1, -1]) {
    const w = new THREE.Mesh(ribbon(s * WALL_D, s * WALL_D, 0, 1.25, ur, 0, 1, true), wallMat);
    w.castShadow = true; w.receiveShadow = true; scene.add(w);
  }
  // start/finiş çizgisi
  const line = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_W * 2, 2.6),
    new THREE.MeshStandardMaterial({ map: checkerTex, roughness: 0.7, polygonOffset: true, polygonOffsetFactor: -5, polygonOffsetUnits: -20 }));
  line.rotation.x = -Math.PI / 2; line.rotation.z = -Math.atan2(T[0].x, T[0].z);
  line.position.copy(P[0]).setY(0.06); line.receiveShadow = true; scene.add(line);
}

/* ───────────────────────── Çevre ───────────────────────── */
const flags = [];
const startLights = [];
function distToTrack(x, z) {
  let m = 1e9;
  for (let i = 0; i < N; i += 3) { const dx = P[i].x - x, dz = P[i].z - z, d = dx * dx + dz * dz; if (d < m) m = d; }
  return Math.sqrt(m);
}
{
  const dummy = new THREE.Object3D();
  // Ağaçlar
  const nTree = 750;

    const buf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

    const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1500; bp.Q.value = 3;

}

  $('finishTitle').textContent = place === 1 ? 'ŞAMPİYON!' : place <= 3 ? place + '. OLDUN!' : place + '. SIRADA BİTİRDİN';
  $('finishSub').textContent = `SÜRE ${fmt(player.finishTime)} · EN İYİ TUR ${player.best ? fmt(player.best) : '—'}`;
  $('results').innerHTML = order.map((r, i) => `<tr class="${r === player ? 'me' : ''}"><td>${i + 1}.</td><td>${r.name}</td><td>${r.finished ? fmt(r.finishTime) : '…'}</td></tr>`).join('');
  $('finish').classList.remove('hidden'); document.body.classList.remove('racing');
}

/* ───────────────────────── Ana döngü ───────────────────────── */
const clock = new THREE.Clock();
let wrongT = 0;
function step(dt, t) {
  if (state === 'countdown') {
    cdT += dt;
    const stp = Math.floor(cdT / 0.9);
    if (stp !== cdStep) {
      cdStep = stp; const el = $('countdown');
      if (stp >= 1 && stp <= 3) {
        el.textContent = 4 - stp; el.style.color = '#fff'; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); beep(440, 0.2);
        for (let i = 0; i < Math.min(5, stp * 2 - 1); i++) startLights[i].emissiveIntensity = 9;
      } else if (stp === 4) {
        el.textContent = 'BAŞLA!'; el.style.color = '#5dff7a'; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); beep(880, 0.5);
        startLights.forEach(m => { m.emissive.setHex(0x10ff30); m.emissiveIntensity = 9; });
        state = 'race'; raceTime = 0; player.lapStart = 0;
      }
    }
  }
  if (state === 'race') raceTime += dt;
  const racing = state === 'race';
  if (state !== 'menu') updatePlayer(dt, racing && !player.finished);
  updateAI(dt, racing || state === 'finished');

  if (racing) {
    const p = player;
    const lap = Math.floor(p.total / N) + 1;
    if (lap > p.lap) {
      const lt = raceTime - p.lapStart;
      if (p.lap >= 1 && (!p.best || lt < p.best)) p.best = lt;
      p.lapStart = raceTime; p.lap = lap;
      if (lap > LAPS) {
        p.finished = true; p.finishTime = raceTime; finishOrder.push(p); state = 'finished';
        burstConfetti(); beep(660, 0.15); setTimeout(() => beep(880, 0.15), 160); setTimeout(() => beep(1320, 0.4), 320);
        hideBanner(); setTimeout(showFinish, 2600);
      } else { showBanner(lap === LAPS ? 'SON TUR!' : `${lap}. TUR`, 'info', 1.8); beep(700, 0.12); }
    }
    // ters yön
    const tn = T[p.idx], along = Math.sin(p.h) * tn.x + Math.cos(p.h) * tn.z;
    wrongT = along < -0.35 && (p.vf || 0) > 4 ? wrongT + dt : 0;
    if (wrongT > 0.8) showBanner('TERS YÖN!', '', 0.3);
    if (bannerT > 0) { bannerT -= dt; if (bannerT <= 0) hideBanner(); }
    if (startLights[0].emissiveIntensity > 0 && raceTime > 3) startLights.forEach(m => m.emissiveIntensity = 0);
  }

  // parçacıklar
  for (const s of smokes) if (s.life > 0) {
    s.life -= dt; const k = 1 - s.life / s.max;
    s.sp.position.x += s.vx * dt; s.sp.position.y += s.vy * dt; s.sp.position.z += s.vz * dt;
    s.sp.scale.setScalar((0.8 + k * 3.4) * s.size); s.sp.material.opacity = 0.5 * (1 - k) * Math.min(1, k * 8);
    if (s.life <= 0) s.sp.visible = false;
  }
  for (let i = 0; i < SPARK_N; i++) if (sparkLife[i] > 0) {
    sparkLife[i] -= dt; const j = i * 3;
    sparkVel[j + 1] -= 22 * dt; sparkPos[j] += sparkVel[j] * dt; sparkPos[j + 1] += sparkVel[j + 1] * dt; sparkPos[j + 2] += sparkVel[j + 2] * dt;
    if (sparkPos[j + 1] < 0.05) { sparkPos[j + 1] = 0.05; sparkVel[j + 1] *= -0.4; }
    if (sparkLife[i] <= 0) sparkPos[j + 1] = -999;
  }
  sparkGeo.attributes.position.needsUpdate = true;
  if (confetti.visible) {
    for (let i = 0; i < CONF_N; i++) {
      const d = confD[i]; d.y += d.vy * dt; d.x += (d.vx + Math.sin(t * 2 + d.r) * 1.2) * dt; d.z += d.vz * dt; d.r += d.rs * dt;
      if (d.y < 0) d.y = 16 + Math.random() * 4;
      _sd.position.set(d.x, d.y, d.z); _sd.rotation.set(d.r, d.r * 0.7, d.r * 1.3); _sd.scale.setScalar(1); _sd.updateMatrix(); confetti.setMatrixAt(i, _sd.matrix);
    }
    confetti.instanceMatrix.needsUpdate = true;
  }
  // bayraklar
  for (const f of flags) {
    const pa = f.geometry.attributes.position, b = f.userData.base;
    for (let i = 0; i < pa.count; i++) { const x = b[i * 3], w = x / 3.4; pa.setZ(i, Math.sin(x * 2.2 - t * 7 + f.userData.ph) * 0.35 * w); pa.setY(i, b[i * 3 + 1] + Math.sin(x * 1.6 - t * 5 + f.userData.ph) * 0.12 * w); }
    pa.needsUpdate = true;
  }
  // ses
  if (eng && actx) {
    const now = actx.currentTime, sp = Math.hypot(player.vx, player.vz), on = state === 'race' || state === 'countdown' || state === 'finished';
    const f = 55 + (player.rpm || 0) * 150 + sp * 0.5;
    eng.o1.frequency.setTargetAtTime(f, now, 0.04); eng.o2.frequency.setTargetAtTime(f * 0.5, now, 0.04);
    eng.lp.frequency.setTargetAtTime(500 + (player.rpm || 0) * 1600, now, 0.05);
    eng.g.gain.setTargetAtTime(on ? 0.1 + (keys.gas ? 0.1 : 0) + (player.nitroOn ? 0.06 : 0) : 0, now, 0.08);
    eng.ng.gain.setTargetAtTime(on && player.sliding ? Math.min(0.22, 0.06 + player.drift * 0.012) : 0, now, 0.06);
  }
}
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  // sabit küçük adımlarla fizik (yüksek hızda tünellemeyi önler)
  const sub = dt > 0.02 ? 2 : 1;
  for (let i = 0; i < sub; i++) step(dt / sub, t);
  updateCamera(dt, t);
  if (state !== 'menu') updateHUD(dt);
  composer.render();
}

/* ───────────────────────── Başlat ───────────────────────── */
resetRace(); snapCamera();
camPos.set(ais[2].x + 12, 4, ais[2].z + 6); camLook.set(ais[2].x, 0.8, ais[2].z);
renderer.compile(scene, camera);
$('startBtn').disabled = false; $('startBtn').textContent = 'YARIŞA BAŞLA';
window.__game = { player, ais, keys, get state() { return state; }, P, K, TRACK_LEN };
frame();
</script>
