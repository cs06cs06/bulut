# Yapay zekâ ayarları
# ----------------------------------------------------------------------------
# Fiyatlar 1 milyon token başına ABD dolarıdır. Web aramasının ayrıca arama başına ücreti vardır.
# effort: low | medium | high | xhigh | max — yükseldikçe daha derin ama daha pahalı.
# ----------------------------------------------------------------------------

ideas:
  model: claude-opus-5-5
  effort: medium
  max_tokens: 16000
  web_searches: 6           # güncel trendleri bulmak için en fazla arama

research:
  model: claude-opus-5-5
  effort: high
  max_tokens: 32000
  web_searches: 12          # aracın güncel arayüzü, fiyatı ve adımları için en fazla arama
  web_fetches: 8            # okunacak en fazla sayfa

script:
  model: claude-opus-5-5
  effort: high
  max_tokens: 32000

metadata:
  model: claude-opus-5-5
  effort: medium
  max_tokens: 8000

budget:
  monthly_usd: 40           # aşılırsa yeni video üretimi başlamaz (yaklaşık video başına 1–2 $)

prices:
  claude-opus-5-5:   { input: 4.00, output: 20.00, cache_write: 5.00, cache_read: 0.20 }
  claude-sonnet-5-5: { input: 2.00, output: 10.00, cache_write: 2.50, cache_read: 0.20 }
  claude-haiku-5-5:  { input: 0.10, output: 0.50, cache_write: 0.125, cache_read: 0.01 }
  web_search_per_1000: 10.00
