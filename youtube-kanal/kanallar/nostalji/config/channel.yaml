# Kanal ayarları — Nostalji (ABD ve Kanada, 60 yaş üstü)
# ----------------------------------------------------------------------------
# Örnek alınan biçim: "Deutschland, wie es einmal war" (Almanya). 1950'ler–1970'lerde Kuzey Amerika'da
# büyüyenler için "o zamanlar herkesin yaptığı 15 şey" türünde 8–12 dakikalık geri sayımlar (+ 2 Shorts).
# Videolar İngilizce üretilir. Bu dosyayı GitHub'da kalem simgesiyle düzenleyebilirsiniz.
# ----------------------------------------------------------------------------

name: "Back In Our Day"            # kanal adı (geçici; istediğiniz adla değiştirin)
tagline: "Life in North America, the way we remember it"
language: en
format: listicle                   # numaralı nostalji listesi (görseller yapay zekâyla üretilir)

niche: >
  Warm, slow-paced nostalgia about everyday life in the United States and Canada from the 1950s to the
  1970s: childhood, school, home and kitchen, family rituals, cars and road trips, shopping, work, holidays,
  rules and habits that were completely normal back then and are unthinkable or forgotten today.

audience: >
  Men and women aged 60 and over living in the United States and Canada (born roughly 1945–1965) who grew up
  in that era and enjoy remembering it, sharing it with grandchildren and talking about it in the comments.

# Arama önerisi tohumları (fikir üretimi). Kalıplar aşağıda.
seeds:
  - 1950s
  - 1960s
  - 1970s
  - growing up in the 60s
  - things from the 70s
  - boomer childhood
  - 1960s Canada
suggest_patterns:
  - "{seed}"
  - "{seed} things"
  - "{seed} nostalgia"
  - "things we did in the {seed}"
  - "{seed} memories"

video:
  target_minutes: 11            # 8–12 dakika "tatlı nokta"; içerik ne kadarsa o kadar, dolgu yok
  min_minutes: 8
  words_per_minute: 140         # Gacrux + "steady" stil ölçülen hız ~142 kelime/dk (sahne arası nefesler hariç)
  fps: 25
  width: 1920
  height: 1080
  formats: [listicle]

listicle:
  items: 15                     # geri sayım: #15 → #1 (en güçlüsü sonda)
  images_per_item: 4            # her görselden geniş/yakın kadrajlar alınır → ~5 sn'de bir görüntü değişimi
  intro_images: 4               # kanca "fragmanı": en çarpıcı maddelerden ~2 sn'lik kesitler
  outro_images: 2

# Kurgu (stratejiler: J-cut, düz kesme, punch-in, sık görüntü değişimi, altyazı, abone anı, bitiş ekranı)
edit:
  jcut_seconds: 0.6             # sonraki maddenin sesi görüntü geçmeden bu kadar önce başlar (J-cut)
  gap_seconds: 0.5              # iki madde anlatımı arasındaki nefes
  shot_seconds: 5               # görüntü değişim aralığı (kancada 2 sn)
  punch_zoom: 1.18              # vurgu cümlesinde ani yakınlaşma (%18)
  captions: true                # anahtar kelimeleri vurgulu altyazı (ekrana yakılır + ayrıca .srt)
  end_screen_seconds: 20        # son 20 sn: YouTube bitiş ekranı öğeleri için alan
  shorts: 2                     # her videodan dikey Shorts (15–45 sn)

# Görsel üretimi (Google Gemini API — Nano Banana)
images:
  provider: google              # google | placeholder (placeholder: anahtarsız deneme)
  model: gemini-nano-banana-2.1
  size: 2K                      # 2K: yakın kadrajlar ve dikey Shorts kırpması için yeterli çözünürlük (~0,050 $)
  aspect_ratio: "16:9"
  price_per_image: 0.0504       # maliyet takibi için (2K)
  concurrency: 4
  # Her görsel isteğinin sonuna eklenen ortak stil: kanalın "görsel kimliği"
  style: >
    Authentic candid color photograph from the era, shot on Kodak film with a 35mm camera, warm amber and
    golden tones, soft natural light, gentle film grain, shallow depth of field, realistic everyday
    North American setting and period-correct details. No text, no captions, no watermark, no readable
    brand logos, no modern objects.

# Hareketli sahneler (Google Veo, aynı GEMINI_API_KEY): kancadan 2 görsel ve #1'den başlayarak maddelerin en uygun
# görseli kısa kliplere çevrilir (en çok 8 klip); diğer görseller kayan/yakınlaşan fotoğraf olarak kalır. Veo
# kalabalık sahnelerde hata yaptığı için adaylar önce Gemini ile puanlanır, kalabalık görseller gönderilmez.
# Kapatmak için bu bölümü silin. Maliyet: en çok 8 klip × 8 sn × 0,08 $ ≈ 5,1 $ / video.
motion:
  provider: google
  model: veo-3.1-lite-generate-preview
  resolution: 1080p             # 1080p yalnızca 8 sn'lik kliplerle çalışır
  duration_seconds: 8           # üretilen klip süresi (ücret buna göre)
  use_seconds: 6                # videoda klibin en çok ilk 6 sn'si kullanılır (Veo hataları genelde sonda olur)
  price_per_second: 0.08        # maliyet takibi için (Veo 3.1 Lite, 1080p)
  hook_clips: 2                 # kancadan en çok kaç görsel hareketli olsun
  max_clips: 8                  # video başına en çok klip (kanca dahil); maddeler #1, #2, … sırasıyla
  screen_min_safety: 4          # ön eleme: görselin hareketlendirme güvenliği (1–5) en az 4 (0–2 kişi, sade sahne)
  concurrency: 4
  qa_model: gemini-3.8-flash    # her klip saniyede bir kareyle denetlenir; bozulma başladığı saniyeden sonrası kullanılmaz
  min_seconds: 2                # temiz kısmı 2 sn'den kısa klip atılır (o görsel sabit fotoğraf kalır)
  # Ortak hareket talimatı: sakin, genel hareketler (Veo bunlarda güvenilir); ellerle ince iş yok
  prompt: >-
    Bring this photograph to life with subtle, natural, realistic motion: people move gently with small gestures,
    a slow walk, a smile or a glance; light flickers softly; leaves, curtains or steam drift in a light breeze.
    Very slow, gentle camera push in. Keep every person, face and object exactly as in the photo. No new objects,
    no close-up hand work, no morphing, no text, 1960s home-movie feel.

# Videodaki film görünümü (ffmpeg filtreleri; görsel sahnelerine uygulanır)
look:
  grade: "eq=contrast=1.06:saturation=1.05:brightness=-0.01,colorbalance=rs=0.05:gs=0.01:bs=-0.06:rm=0.03:bm=-0.04"   # sıcak 70'ler tonu
  grain: 0.10                   # film greni yoğunluğu (0–0,3)
  vignette: 0.45                # kenar kararması (0–1)

# Kapak: tam ekran görsel + altta siyah şerit, beyaz yazı ve sarı-kehribar vurgu
thumbnail:
  style: bar

brand:
  accent: "#FFB703"             # kehribar sarısı (kapak ve madde numaraları)
  accent2: "#E85D04"            # turuncu
  background: "#0B0B0B"
  text: "#FFFFFF"
  font: "Montserrat"

voice:
  provider: google              # google (Gemini, ~0,5 $/video) | elevenlabs | openai | silent
  google:
    model: gemini-3.8-flash-tts
    voice: Gacrux               # Google hazır sesleri: Gacrux, Charon, Algenib, Sadaltager…
    style: >-
      Warm older American man telling stories from his childhood at a steady, natural conversational pace;
      gentle, nostalgic and friendly, with a soft smile in his voice. Keep pauses short.
  elevenlabs:
    voice_id: "nPczCjzI2devNBz1zQrb"   # "Brian": derin, sıcak Amerikalı erkek anlatıcı (alternatif: Bill pqHfZKP75CvOlQylNhV4)
    model_id: "eleven_multilingual_v2"
    stability: 0.55
    similarity_boost: 0.8
  openai:
    model: "gpt-4o-mini-tts"
    voice: "ash"
    instructions: "Warm, unhurried older male storyteller. Gentle, nostalgic, friendly."
  lead_in_seconds: 0.4
  tail_seconds: 0.8
  music: ""                     # isteğe bağlı telifsiz fon müziği (ör. assets/music.mp3)
  music_volume: 0.06

schedule:
  days: [mon, wed, fri]

topics:
  auto_approve: true
  ideas_per_run: 12

youtube:
  upload: false
  privacy: private
  category_id: "22"             # People & Blogs
  made_for_kids: false
  # Fotogerçekçi yapay zekâ görselleri gerçek arşiv fotoğrafı sanılabileceği için beyan açık.
  contains_synthetic_media: true
  default_tags: ["nostalgia", "1960s", "1970s", "baby boomers", "memories", "growing up"]

description:
  affiliate_disclosure: ""
  ai_disclosure: >
    The narration and images in this video are AI-generated illustrations of everyday life in the
    1950s–1970s, not archival photographs. Memories differ from town to town, so tell us in the comments
    how it was where you grew up.
  footer: ""
