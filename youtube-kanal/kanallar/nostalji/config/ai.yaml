# Yapay zekâ ayarları — Nostalji kanalı
# ----------------------------------------------------------------------------
# Fiyatlar 1 milyon token başına ABD dolarıdır. Web aramasının ayrıca arama başına ücreti vardır.
# effort: low | medium | high | xhigh | max — yükseldikçe daha derin ama daha pahalı.
# ----------------------------------------------------------------------------

ideas:
  model: claude-opus-5-5
  effort: medium
  max_tokens: 16000
  web_searches: 5

research:
  model: claude-opus-5-5
  effort: high
  max_tokens: 32000
  web_searches: 12          # dönem bilgilerini (fiyatlar, yasalar, markalar, tarihler) doğrulamak için
  web_fetches: 8

script:
  model: claude-opus-5-5
  effort: high
  max_tokens: 64000         # ~30 dakikalık anlatım + görsel tarifleri

metadata:
  model: claude-opus-5-5
  effort: medium
  max_tokens: 8000

budget:
  monthly_usd: 80           # yapay zekâ + görsel üretimi; aşılırsa yeni video başlamaz (video başına ~4–5 $)

prices:
  claude-opus-5-5:   { input: 4.00, output: 20.00, cache_write: 5.00, cache_read: 0.20 }
  claude-sonnet-5-5: { input: 2.00, output: 10.00, cache_write: 2.50, cache_read: 0.20 }
  claude-haiku-5-5:  { input: 0.10, output: 0.50, cache_write: 0.125, cache_read: 0.01 }
  web_search_per_1000: 10.00
