<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>stage</title>
<style>
  :root {
    --accent: #FFD60A; --accent2: #3A86FF; --bg: #0B0F19; --text: #F5F7FA;
    --font: 'Inter', 'DejaVu Sans', sans-serif;
    --mono: 'DejaVu Sans Mono', 'Liberation Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  body { font-family: var(--font); color: var(--text); -webkit-font-smoothing: antialiased; }

  #bg { position: absolute; inset: 0; overflow: hidden;
    background:
      radial-gradient(1200px 700px at 85% -10%, color-mix(in srgb, var(--accent2) 22%, transparent), transparent 70%),
      radial-gradient(900px 600px at -10% 110%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 70%),
      var(--bg); }
  #grid { position: absolute; inset: -80px; opacity: .07;
    background-image: linear-gradient(var(--text) 1px, transparent 1px), linear-gradient(90deg, var(--text) 1px, transparent 1px);
    background-size: 80px 80px; }

  #root { position: absolute; inset: 0; }
  .chip { position: absolute; top: 44px; left: 64px; display: flex; gap: 14px; align-items: center; z-index: 5;
    font-weight: 700; font-size: 26px; letter-spacing: .02em; }
  .chip .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 18px var(--accent); }
  .chip .chan { opacity: .9; }
  .chip .chap { padding: 6px 16px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14);
    font-weight: 600; font-size: 22px; opacity: .9; }
  #progress { position: absolute; left: 0; bottom: 0; height: 6px; background: var(--accent); z-index: 6; }

  /* title */
  .title-wrap { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 160px; }
  .title-h { font-size: 112px; font-weight: 800; line-height: 1.04; letter-spacing: -0.03em; max-width: 1500px; }
  .title-h .w { display: inline-block; margin-right: .22em; }
  .title-bar { height: 12px; width: 220px; background: var(--accent); border-radius: 6px; margin: 44px 0 34px; transform-origin: left; }
  .title-sub { font-size: 44px; font-weight: 500; opacity: .78; max-width: 1400px; line-height: 1.3; }

  /* bullets / steps / compare common heading */
  .panel { position: absolute; inset: 0; padding: 140px 160px 110px; display: flex; flex-direction: column; justify-content: safe center; gap: 64px; }
  .h2 { font-size: 80px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
  .editor-h { position: absolute; top: 150px; left: 160px; right: 160px; }
  .list { display: flex; flex-direction: column; gap: 40px; }
  .item { display: flex; align-items: center; gap: 34px; font-size: 62px; font-weight: 600; line-height: 1.2; }
  .item .mark { flex: none; width: 26px; height: 26px; border-radius: 8px; background: var(--accent); transform: rotate(45deg); }
  .step { display: flex; align-items: flex-start; gap: 34px; }
  .step .num { flex: none; width: 82px; height: 82px; border-radius: 50%; display: grid; place-items: center;
    background: var(--accent); color: var(--bg); font-weight: 800; font-size: 44px; }
  .step .txt { font-size: 56px; font-weight: 650; line-height: 1.2; padding-top: 10px; }
  .step .det { font-size: 34px; font-weight: 500; opacity: .7; margin-top: 8px; font-family: var(--mono); }

  table { width: 100%; border-collapse: separate; border-spacing: 0 14px; }
  th { font-size: 44px; font-weight: 800; text-align: left; padding: 14px 28px; color: var(--bg); background: var(--accent); }
  th:first-child { background: transparent; }
  th:nth-child(2) { border-radius: 16px 0 0 16px; } th:last-child { border-radius: 0 16px 16px 0; }
  td { font-size: 42px; font-weight: 550; padding: 20px 28px; background: rgba(255,255,255,.06); }
  td:first-child { font-weight: 750; border-radius: 16px 0 0 16px; color: var(--accent); background: rgba(255,255,255,.03); }
  td:last-child { border-radius: 0 16px 16px 0; }

  /* code */
  .editor { position: absolute; top: 300px; left: 160px; right: 160px; bottom: 120px; border-radius: 22px; background: #0d1117;
    border: 1px solid rgba(255,255,255,.12); box-shadow: 0 40px 120px rgba(0,0,0,.5); overflow: hidden; }
  .editor .bar { height: 58px; background: #161b22; display: flex; align-items: center; gap: 12px; padding: 0 24px; }
  .editor .bar i { width: 16px; height: 16px; border-radius: 50%; display: block; }
  .editor .lang { margin-left: 16px; font-family: var(--mono); font-size: 22px; opacity: .6; }
  .editor pre { padding: 34px 44px; font-family: var(--mono); font-size: 36px; line-height: 1.5; white-space: pre-wrap; color: #e6edf3; }
  .caret { display: inline-block; width: .55em; height: 1.1em; vertical-align: -0.15em; background: var(--accent); }

  /* callout */
  .callout { position: absolute; left: 240px; right: 240px; top: 50%; transform: translateY(-50%); padding: 70px 80px;
    border-radius: 32px; background: rgba(255,255,255,.06); border: 3px solid var(--accent); display: flex; gap: 60px; align-items: center; }
  .callout svg { flex: none; width: 160px; height: 160px; }
  .callout .k { font-size: 30px; font-weight: 800; letter-spacing: .14em; color: var(--accent); margin-bottom: 18px; }
  .callout .t { font-size: 60px; font-weight: 700; line-height: 1.2; }

  /* outro */
  .outro { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 40px; }
  .outro .oh { font-size: 100px; font-weight: 800; letter-spacing: -0.03em; }
  .outro .cta { font-size: 46px; opacity: .8; }
  .outro .sub { margin-top: 30px; padding: 26px 64px; border-radius: 999px; background: #ff0033; color: #fff; font-size: 48px; font-weight: 800; }
  .outro .chan { font-size: 34px; font-weight: 700; opacity: .7; }

  /* browser */
  .win { position: absolute; left: 120px; top: 116px; width: 1680px; height: 993px; border-radius: 22px; overflow: hidden;
    background: #fff; box-shadow: 0 50px 140px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.12); }
  .win .bar { position: absolute; top: 0; left: 0; right: 0; height: 48px; background: #eceff3; display: flex; align-items: center; gap: 10px; padding: 0 20px; z-index: 3; }
  .win .bar i { width: 14px; height: 14px; border-radius: 50%; display: block; }
  .win .url { margin-left: 22px; flex: 1; max-width: 900px; height: 30px; border-radius: 15px; background: #fff; color: #444;
    font-size: 17px; display: flex; align-items: center; padding: 0 18px; font-family: var(--font); white-space: nowrap; overflow: hidden; }
  .vp { position: absolute; top: 48px; left: 0; width: 1680px; height: 945px; overflow: hidden; background: #fff; }
  .layer { position: absolute; inset: 0; }
  .cam { position: absolute; left: 0; top: 0; width: 1680px; height: 945px; transform-origin: 0 0; }
  .cam img { width: 1680px; height: 945px; display: block; }
  .ring { position: absolute; border: 5px solid var(--accent); border-radius: 14px; box-shadow: 0 0 0 9999px rgba(8,10,20,.45), 0 0 40px var(--accent); }
  .cursor { position: absolute; width: 46px; height: 46px; z-index: 4; filter: drop-shadow(0 4px 8px rgba(0,0,0,.4)); }
  .ripple { position: absolute; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%; border: 6px solid var(--accent); z-index: 4; }
  .cap { position: absolute; left: 50%; bottom: 70px; transform: translateX(-50%); z-index: 7; padding: 18px 40px; border-radius: 18px;
    background: rgba(11,15,25,.92); color: var(--text); font-size: 40px; font-weight: 700; white-space: nowrap;
    border: 2px solid rgba(255,255,255,.12); box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  .cap b { color: var(--accent); }
</style>
</head>
<body>
<div id="bg"><div id="grid"></div></div>
<div id="root"></div>
<div id="progress"></div>
<script src="stage.js"></script>
</body>
</html>
