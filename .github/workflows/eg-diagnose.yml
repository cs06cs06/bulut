# Geçici teşhis: workers.dev'e taşıma öncesi hesap ve anahtar izinleri.
name: "Enfeksiyon Gündemi · Teşhis"

on:
  push:
    branches: [ccr-88cdf477-ndx7x5]
    paths:
      - ".github/workflows/eg-diagnose.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Hesap ve izinler
        run: |
          api() { curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4$1"; }
          echo "== workers.dev alt alan adı =="
          api "/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -c '{success, subdomain: .result.subdomain, errors: [.errors[]?.message]}'
          echo "== Worker listesi (yetki denemesi) =="
          api "/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" | jq -c '{success, count: (.result|length?), errors: [.errors[]?.message]}'
          echo "== Access uygulamaları (yetki denemesi) =="
          api "/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps" | jq -c '{success, apps: [.result[]? | {name, domain, self_hosted_domains}], errors: [.errors[]?.message]}'
          echo "== Pages projesi =="
          api "/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/enfeksiyon-gundemi" | jq -c '{success, subdomain: .result.subdomain, domains: .result.domains}'
