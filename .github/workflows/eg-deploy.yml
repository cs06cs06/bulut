# Enfeksiyon Gündemi: veritabanını hazırlar ve web uygulamasını Cloudflare Pages'e yayınlar.
name: "Enfeksiyon Gündemi · Yayın"

on:
  push:
    branches: [main, ccr-88cdf477-ndx7x5]
    paths:
      - "enfeksiyon-gundemi/web/**"
      - "enfeksiyon-gundemi/db/**"
      - "enfeksiyon-gundemi/scripts/**"
      - ".github/workflows/eg-deploy.yml"
  workflow_dispatch:

# Veritabanına dokunan tüm işler sırayla çalışır.
concurrency:
  group: enfeksiyon-gundemi-db
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: enfeksiyon-gundemi/web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ACCESS_TEAM_DOMAIN: ${{ secrets.EG_ACCESS_TEAM_DOMAIN }}
      ACCESS_AUD: ${{ secrets.EG_ACCESS_AUD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: enfeksiyon-gundemi/web/package-lock.json
      - run: npm ci
      - name: Veritabanını hazırla
        run: ../scripts/prepare-db.sh
      - name: Derle
        run: npm run build
      - name: Pages projesini hazırla
        run: |
          npx wrangler pages project create enfeksiyon-gundemi --production-branch=main \
            || echo "Proje zaten var."
      - name: Yayınla
        run: npx wrangler pages deploy --branch=main --commit-dirty=true
