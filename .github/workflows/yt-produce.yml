# YouTube kanalı: sıradaki konudan baştan sona bir video üretir.
name: "YouTube Kanalı · Video üret"

on:
  schedule:
    # Saat UTC'dir (Türkiye = UTC+3). Her gün çalışır; yalnızca kanalın config/channel.yaml → schedule.days
    # günlerinde video üretir, diğer günler bir dakikada biter. Zamanlanmış çalıştırma nostalji kanalını üretir.
    - cron: "23 5 * * *" # 08:23
  workflow_dispatch:
    inputs:
      kanal:
        description: "Kanal"
        type: choice
        options: [nostalji, ai-egitim]
        default: nostalji
      topic_id:
        description: "İsteğe bağlı: kanalın data/backlog.yaml dosyasındaki konu id değeri (boş: sıradaki konu)"
        required: false
        default: ""

concurrency:
  group: youtube-kanal
  cancel-in-progress: false

permissions:
  contents: write # bölüm metinlerini kaydetmek ve videoyu "Releases"a eklemek için
  actions: write # "zamanlamayı canlı tut" adımı için

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      KANAL: ${{ inputs.kanal || 'nostalji' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      TOPIC_ID: ${{ inputs.topic_id }}
    defaults:
      run:
        working-directory: youtube-kanal/pipeline
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: youtube-kanal/pipeline/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Araçları kur (ffmpeg, yazı tipi, Chromium)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-inter fonts-dejavu-core > /dev/null
          npm ci
          npx playwright install --with-deps chromium
          # derinlik (parallax) efekti için (ücretsiz, bilgisayarda çalışır)
          python -m pip install -q numpy opencv-python-headless onnxruntime
      - name: Derinlik modelini önbellekten al
        uses: actions/cache@v4
        with:
          path: ~/.cache/yt-kanal
          key: yt-depth-anything-v2-small
      - name: Yarım kalan çalışmayı geri yükle
        uses: actions/cache/restore@v4
        with:
          path: youtube-kanal/kanallar/${{ env.KANAL }}/work
          key: yt-work-${{ env.KANAL }}-${{ github.run_id }}
          restore-keys: yt-work-${{ env.KANAL }}-
      - name: Video üret
        id: produce
        run: npm run produce
      - name: Bölüm metinlerini kaydet
        if: ${{ !cancelled() }}
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube-kanal/kanallar/$KANAL/data youtube-kanal/kanallar/$KANAL/episodes
          if git diff --cached --quiet; then echo "Kaydedilecek değişiklik yok."; exit 0; fi
          git commit -q -m "YouTube kanalı ($KANAL): ${{ steps.produce.outputs.episode || 'konu listesi' }}"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep $((i * 5)); done
          echo "::error::Değişiklikler depoya gönderilemedi"; exit 1
      - name: Videoyu "Releases"a ekle
        if: ${{ steps.produce.outputs.out_dir != '' }}
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          EP: ${{ steps.produce.outputs.episode }}
          OUT: ${{ steps.produce.outputs.out_dir }}
          TITLE: ${{ steps.produce.outputs.title }}
        run: |
          TAG="yt-$KANAL-$EP"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          shopt -s nullglob
          SHORTS=("$OUT"/short-*.mp4)
          gh release create "$TAG" "$OUT/video.mp4" "$OUT/thumbnail.jpg" "$OUT/captions.srt" "$OUT/upload.txt" "${SHORTS[@]}" \
            --target "${{ github.ref_name }}" --title "🎬 $TITLE" --notes-file "$OUT/upload.txt" --latest=false
          echo "### 📥 İndir: $(gh release view "$TAG" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"
          W="youtube-kanal/kanallar/$KANAL/work"
          rm -rf "$W/${EP:?}" && mkdir -p "$W" && touch "$W/.keep"
      - name: Yarım kalan çalışmayı sakla
        # Başarısız çalıştırmada ses, görseller ve ekran görüntüleri bir sonraki denemede yeniden kullanılır.
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: youtube-kanal/kanallar/${{ env.KANAL }}/work
          key: yt-work-${{ env.KANAL }}-${{ github.run_id }}
      - name: Zamanlamayı canlı tut
        # GitHub, uzun süre etkinlik olmayan depolarda zamanlanmış işleri kapatır; yeniden etkinleştirmek süreyi sıfırlar.
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sf -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/yt-produce.yml/enable" \
            && echo "Zamanlama etkin tutuldu." || echo "::warning::Zamanlama yenilenemedi."
