# Enfeksiyon Gündemi: günlük yayın toplama ve yapay zekâ değerlendirmesi.
name: "Enfeksiyon Gündemi · Günlük toplama"

on:
  schedule:
    # Saatler UTC'dir (Türkiye = UTC+3). Saat başlarında GitHub yoğun olduğu için dakikalar kaydırıldı.
    - cron: "47 1 * * *"   # 04:47 — ana çalıştırma (baskı ~06:30'a hazır olsun)
    - cron: "17 9 * * *"   # 12:17 — toparlama (sabah yarım kalanlar için)
  workflow_dispatch:
  push:
    branches: [ccr-88cdf477-ndx7x5]
    paths:
      - "enfeksiyon-gundemi/pipeline/**"
      - "enfeksiyon-gundemi/config/**"
      - "enfeksiyon-gundemi/prompts/**"
      - ".github/workflows/eg-collect.yml"

concurrency:
  group: enfeksiyon-gundemi-db
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # yalnızca aşağıdaki "zamanlamayı canlı tut" adımı için

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            enfeksiyon-gundemi/web/package-lock.json
            enfeksiyon-gundemi/pipeline/package-lock.json
      - name: Bağımlılıkları kur
        run: |
          npm ci --prefix enfeksiyon-gundemi/web
          npm ci --prefix enfeksiyon-gundemi/pipeline
      - name: Veritabanını hazırla
        run: enfeksiyon-gundemi/scripts/prepare-db.sh
      - name: Topla
        working-directory: enfeksiyon-gundemi/pipeline
        run: npm run collect
      - name: Değerlendir (triyaj ve editör yazıları)
        # Toplama kısmen başarısız olsa da eldeki kayıtlar değerlendirilsin
        if: ${{ !cancelled() }}
        working-directory: enfeksiyon-gundemi/pipeline
        run: npm run process
      - name: Zamanlamayı canlı tut
        # GitHub, uzun süre etkinlik olmayan depolarda zamanlanmış işleri kapatır.
        # İş akışını yeniden "etkin" işaretlemek bu süreyi sıfırlar (boş commit gerekmez).
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sf -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/eg-collect.yml/enable" \
            && echo "Zamanlama etkin tutuldu." || echo "::warning::Zamanlama yenilenemedi."
