name: Hugging Face Space'e yayınla

on:
  push:
    branches: [main]
    paths: [Dockerfile, requirements.txt, "tts_app/**", "deploy/huggingface/**", ".github/workflows/deploy-hf-space.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
    steps:
      - uses: actions/checkout@v4

      - name: Ayarları denetle
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "::error::HF_TOKEN secret'ı ve HF_SPACE değişkeni (ör. kullanici/ema-seslendirici) tanımlı olmalı."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Space'i oluştur veya güncelle
        run: |
          pip install -q "huggingface_hub>=0.24"
          mkdir -p space
          cp -r Dockerfile .dockerignore requirements.txt tts_app space/
          cp deploy/huggingface/README.md space/README.md
          find space -name __pycache__ -prune -exec rm -rf {} +
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ["HF_SPACE"]
          api.create_repo(space, repo_type="space", space_sdk="docker", exist_ok=True)
          api.upload_folder(folder_path="space", repo_id=space, repo_type="space",
                            commit_message=f"GitHub {os.environ['GITHUB_SHA'][:7]} sürümünü yayınla",
                            delete_patterns=["*"])
          print(f"Yayında: https://huggingface.co/spaces/{space}")
          PY
